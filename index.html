<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Compagnie de l'Aube</title>
<meta name="theme-color" content="#110e15">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compagnie">
<script src="config.js"></script>
<script>
  /* Adresse du moteur et versions : dans config.js (réglages communs) */
  if ('serviceWorker' in navigator) {
    /* Nouvelle version publiée : la page se recharge d'elle-même une fois la nouvelle copie prête (pas au tout premier lancement) */
    const avaitCopie = !!navigator.serviceWorker.controller;
    let recharge = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (avaitCopie && !recharge) { recharge = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      // Android garde l'app en mémoire : on revérifie les mises à jour à chaque retour sur l'app
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    }).catch(() => {});
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #110e15; --panel: #1c1722; --card: #241e2c; --card-done: #1d2a22;
    --line: #362e40; --text: #ece6f2; --muted: #9a90a6;
    --gold: #d4ad3c; --xp: #9b5de5; --xp2: #c08cff; --pv: #e05555; --ok: #4fbf7a;
    --warn: #e0a040; --rest: #5b8fd6; --epic: #b06cff;
    --haut: #2a1f38; --f-titre: Cinzel, serif; --f-recit: var(--f-recit); --f-texte: Inter, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--f-texte); }
  body { padding: 0 0 48px; min-height: 100vh;
    background: radial-gradient(ellipse at top, var(--haut) 0%, var(--bg) 55%); }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* En-tête personnage */
  header { padding: 22px 0 6px; }
  .hero-row { display: flex; align-items: center; gap: 14px; }
  .profil { cursor: pointer; margin: -6px -8px; padding: 6px 8px; border-radius: 14px; -webkit-tap-highlight-color: transparent; transition: background .15s; }
  .profil:active { background: #221c2a; }
  .profil .hero-txt { flex: 1; min-width: 0; }
  .profil .chev { color: var(--gold); font-size: 26px; line-height: 1; opacity: .8; display: flex; align-items: center; gap: 2px; margin-right: 34px; }
  .avenir-bloc { margin: 10px 0 4px; } .avenir-bloc summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 12px; list-style: none; }
  .avenir-bloc summary::-webkit-details-marker { display: none; } .avenir-bloc[open] summary { color: var(--gold); margin-bottom: 6px; }
  .card.avenir { opacity: .6; filter: saturate(.5); pointer-events: none; }
  .profil .chev small { font: 600 10px var(--f-texte); letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; opacity: .9; }
  .lvl { width: 66px; height: 66px; flex: none; border-radius: 50%;
    display: grid; place-items: center; position: relative;
    background: conic-gradient(var(--gold) calc(var(--p) * 1%), #3a3145 0);
    box-shadow: 0 0 24px rgba(212,173,60,.25); }
  .lvl::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--panel); }
  .lvl span { position: relative; font-family: var(--f-titre); font-weight: 800; font-size: 24px; color: var(--gold); }
  .lvl small { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .08em; background: var(--gold); color: #1a1408;
    padding: 1px 6px; border-radius: 6px; font-weight: 700; }
  .hero-name { font-family: var(--f-titre); font-size: 21px; font-weight: 800; letter-spacing: .02em; line-height: 1.15; }
  .hero-title { font-family: var(--f-titre); color: var(--gold); font-size: 14px; font-style: italic; margin-top: 2px; }
  .hero-sub { color: var(--muted); font-size: 12px; margin-top: 3px; }

  .bars { margin-top: 16px; display: grid; gap: 10px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .bar-label b { color: var(--text); font-weight: 600; }
  .bar { height: 10px; border-radius: 6px; background: #2c2535; overflow: hidden; position: relative; }
  .bar > i { display: block; height: 100%; border-radius: 6px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .bar.xp > i { background: linear-gradient(90deg, var(--xp), var(--xp2)); }
  .bar.pv > i { background: linear-gradient(90deg, #b83a3a, var(--pv)); }

  /* Filtre Perso / Pro */
  .filters { display: flex; gap: 8px; margin: 18px 0 4px; }
  .filters button { flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font: 600 13px Inter, sans-serif; cursor: pointer; }
  .filters button.on { background: var(--card); color: var(--text); border-color: var(--gold); }

  .section { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 22px 0 10px; }
  .section h2 { margin: 0; font-family: var(--f-titre); font-size: 15px; letter-spacing: .06em; color: var(--gold); text-transform: uppercase; }
  .section span { font-size: 12px; color: var(--muted); }
  .empty { padding: 16px; border-radius: 14px; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; text-align: center; }

  /* Cartes */
  .list { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .card { display: flex; align-items: center; gap: 12px; padding: 13px 12px 13px 14px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); cursor: pointer; user-select: none;
    transition: transform .12s, background .25s, border-color .25s; position: relative; }
  .card:active { transform: scale(.98); }
  .card.small { padding: 10px 12px; opacity: .85; }
  .card.small .icon { width: 34px; height: 34px; font-size: 17px; }
  .card.small .name { font-size: 14px; }
  .card.annexe { border-left: 3px solid var(--gold); }
  .card.done { background: var(--card-done); border-color: #2f5a3e; }
  .card.missed { border-color: #6a2e2e; }
  .card.rest { border-color: #2e466a; }
  .card.busy { opacity: .5; pointer-events: none; }
  .icon { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center;
    font-size: 21px; background: #2f2739; }
  .card.done .icon { background: #24402f; }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 600; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
  .meta .pro { color: var(--warn); font-weight: 600; }
  .meta .bonus { color: var(--gold); font-weight: 600; }
  .right { text-align: right; flex: none; }
  .week { font-size: 12px; color: var(--muted); }
  .week b { color: var(--text); }
  .week.ok b { color: var(--ok); }
  .chip { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .chip.f { background: #24402f; color: var(--ok); }
  .chip.r { background: #4a2323; color: #ff8b8b; }
  .chip.p { background: #22344f; color: #8fb6ee; }
  .chip.n { background: #2f2739; color: var(--muted); font-weight: 600; }
  .more { width: 40px; height: 40px; flex: none; border: 0; border-radius: 10px; background: transparent;
    color: var(--muted); font-size: 20px; cursor: pointer; }
  .more:active { background: #2f2739; }

  /* Quêtes épiques */
  .epic { padding: 14px; border-radius: 14px; background: linear-gradient(135deg, #2a1f3a, #221b2b);
    border: 1px solid #4a3866; }
  .epic-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .epic-name { font-weight: 700; font-size: 14px; }
  .epic-reward { font-size: 12px; color: var(--gold); white-space: nowrap; font-weight: 600; }
  .epic .bar { height: 8px; margin: 10px 0 6px; }
  .epic .bar > i { background: linear-gradient(90deg, #7b3fd1, var(--epic)); }
  .epic .bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--gold); border-radius: 1px; }
  .epic-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .st-ok { color: var(--ok); font-weight: 600; } .st-late { color: var(--warn); font-weight: 600; }
  .st-done { color: var(--gold); font-weight: 700; } .st-fail { color: var(--pv); font-weight: 600; }

  .streak { color: #ff9b4a; font-weight: 700; }
  .etat { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.45; }
  .etat.epuise { background: #3a2a14; border: 1px solid #7a5a22; color: #f3d39a; }
  .etat.terre { background: #3a1717; border: 1px solid #8a3030; color: #ffc2c2; }
  .etat b { color: #fff; }
  .etat.vac { background: #12303a; border: 1px solid #2c6a7a; color: #bfe8f2; }
  .etat button, .vac-btn { margin-top: 8px; padding: 8px 12px; border-radius: 10px; border: 1px solid #2c6a7a;
    background: #173d49; color: #e6f7fb; font: 600 13px Inter, sans-serif; cursor: pointer; }
  .vac-btn { display: block; width: 100%; margin-top: 22px; background: transparent; border-style: dashed; color: var(--muted); border-color: var(--line); }
  .pips { display: inline-flex; gap: 5px; margin-left: 6px; vertical-align: middle; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: #5a2a2a; border: 1px solid #a04545; }
  .pips i.on { background: var(--ok); border-color: var(--ok); }
  .joker { display: inline-block; margin-left: 6px; font-size: 11px; padding: 1px 7px; border-radius: 8px;
    background: #22344f; color: #8fb6ee; font-weight: 600; }
  /* Bilan */
  .bilan { padding: 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .bilan.dimanche { background: linear-gradient(135deg, #2b2410, #1f1a12); border-color: #6a5320; }
  .bilan h3 { margin: 0 0 4px; font-family: var(--f-titre); color: var(--gold); font-size: 16px; }
  .bilan .sous { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .kpi { background: rgba(255,255,255,.04); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .kpi b { display: block; font-family: var(--f-titre); font-size: 20px; }
  .kpi span { font-size: 11px; color: var(--muted); }
  .kpi .up { color: var(--ok); font-size: 11px; font-weight: 600; } .kpi .down { color: var(--pv); font-size: 11px; font-weight: 600; }
  .bilan p { margin: 12px 0 0; font-size: 13px; line-height: 1.5; }
  .bonus-pop { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); z-index: 28; pointer-events: none;
    background: linear-gradient(135deg, #3a2a0e, #241a08); border: 1px solid var(--gold); border-radius: 16px;
    padding: 16px 22px; text-align: center; animation: pop 2.6s forwards; min-width: 240px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  .bonus-pop b { display: block; font-family: var(--f-titre); color: var(--gold); font-size: 22px; }
  .bonus-pop span { font-size: 13px; color: var(--text); }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.9); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.03); }
    80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -20px); } }
  .compagnie { text-align: center; padding-top: 16px; }
  .compagnie b { display: block; font-family: var(--f-titre); font-size: 12px; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  .compagnie span { display: block; font-size: 11px; color: var(--muted); font-style: italic; margin-top: 3px; }
  @media (max-width: 520px) { .compagnie { padding-top: 10px; } .compagnie span { display: none; } }
  /* Avatar */
  @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .95; transform: scale(1.05); } }
  @keyframes sway { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(1.4deg); } }
  @keyframes floatp { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
  @keyframes glow { 0%,100% { opacity: .65; } 50% { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  svg .aura { transform-origin: 100px 140px; animation: pulse 3.2s ease-in-out infinite; }
  svg .cape { transform-origin: 100px 100px; animation: sway 4s ease-in-out infinite; }
  svg .p { animation: floatp 3.6s linear infinite; }
  svg .eyes { animation: glow 1.8s ease-in-out infinite; }
  svg .spin { animation: spin 14s linear infinite; }
  svg .bob { animation: bob 2.6s ease-in-out infinite; }
  .hero-card { margin-top: 18px; display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center;
    padding: 12px; border-radius: 16px; border: 1px solid #4a3866; background: radial-gradient(circle at 25% 50%, #2c2142, #1c1722 70%); }
  .hero-card svg { width: 150px; height: auto; display: block; }
  .classe { font-family: var(--f-titre); color: var(--gold); font-size: 17px; font-weight: 800; }
  .classe-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
  .sous { font-size: 11.5px; color: var(--muted); font-style: italic; margin: 1px 0 2px; font-weight: 400; font-family: inherit; letter-spacing: 0; }
  .next-evo { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.04); font-size: 12px; }
  .next-evo svg { width: 38px; filter: brightness(0) invert(.35); opacity: .7; }
  /* d20 du jour */
  .d20-ov { position: fixed; inset: 0; z-index: 40; display: none; place-items: center; padding: 16px;
    background: radial-gradient(circle at 50% 38%, rgba(212,173,60,.28), transparent 62%), rgba(14,11,18,.985); }
  .d20-ov.on { display: grid; }
  .d20-box { width: 100%; max-width: 360px; text-align: center; }
  .d20-box h2 { font-family: var(--f-titre); color: var(--gold); font-size: 22px; margin: 0 0 6px; letter-spacing: .04em; }
  .d20-sub { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0 0 6px; }
  .d20 { width: 170px; height: 170px; display: block; margin: 10px auto; filter: drop-shadow(0 8px 18px rgba(0,0,0,.55)); }
  .d20 text { font-family: var(--f-titre); font-weight: 800; }
  .engrenage { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.04); font-size: 17px; line-height: 1; cursor: pointer; color: inherit; }
  header { position: relative; }
  .version { margin: 22px 0 8px; text-align: center; font-size: 11.5px; color: var(--muted); opacity: .85; display: grid; gap: 2px; line-height: 1.45; } .version b { color: var(--text); font-weight: 600; }
  .hero-perso { position: relative; cursor: pointer; }
  .hero-perso .loupe { position: absolute; right: 4px; bottom: 6px; font-size: 10.5px; padding: 2px 7px; border-radius: 99px; background: rgba(0,0,0,.45); color: var(--gold); border: 1px solid rgba(212,173,60,.4); }
  svg[data-lueur="argent"] { filter: drop-shadow(0 0 4px rgba(220,230,245,.75)); }
  svg[data-lueur="or"] { filter: drop-shadow(0 0 5px rgba(240,200,90,.8)); }
  svg[data-lueur="pourpre"] { filter: drop-shadow(0 0 5px rgba(190,50,110,.8)); }
  svg[data-lueur="aube"] { animation: aube 6s linear infinite; }
  @keyframes aube { 0%,100% { filter: drop-shadow(0 0 5px rgba(255,170,90,.8)); } 50% { filter: drop-shadow(0 0 6px rgba(170,140,255,.8)); } }
  .orn-fam { animation: flotte 3.2s ease-in-out infinite; transform-box: fill-box; }
  .orn-emb .scint, .orn-emb { animation: scint 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .orn-sol .tourne { animation: tourne 9s linear infinite; }
  .orn-sol .braise { animation: braise 3.8s ease-in infinite; transform-box: fill-box; }
  .orn-sol .pet { animation: pet 5s ease-in-out infinite; transform-box: fill-box; }
  .orn .flam { animation: flam 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes flotte { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes scint { 0%,100% { opacity: .85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes tourne { to { stroke-dashoffset: -60; } }
  @keyframes braise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-46px); opacity: 0; } }
  @keyframes pet { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(2px,-2px) rotate(25deg); } }
  @keyframes flam { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.15) skewX(4deg); } }
  #vitrine { position: fixed; inset: 0; z-index: 60; background: rgba(8,6,12,.86); backdrop-filter: blur(6px); display: none; overflow-y: auto; }
  #vitrine.on { display: block; animation: vitIn .25s ease-out; }
  @keyframes vitIn { from { opacity: 0; } to { opacity: 1; } }
  .vit-box { max-width: 460px; margin: 0 auto; padding: 18px 16px 40px; position: relative; }
  .vit-x { position: sticky; top: 0; float: right; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: #1c1726; color: var(--text); font-size: 16px; cursor: pointer; z-index: 2; }
  .vit-nom { text-align: center; margin: 6px 0 0; } .vit-nom b { display: block; font: 600 22px var(--f-recit); color: var(--gold); } .vit-nom span { font-size: 13px; color: var(--muted); }
  .vit-scene { position: relative; height: min(70vh, 470px); perspective: 900px; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .vit-scene::before { content: ''; position: absolute; left: 50%; top: 52%; width: 300px; height: 300px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(127,214,255,.18), transparent 65%); animation: pulse 5s ease-in-out infinite; }
  .vit-scene.voleur::before { background: radial-gradient(circle, rgba(170,110,255,.2), transparent 65%); }
  @keyframes pulse { 0%,100% { opacity: .6; transform: translate(-50%,-50%) scale(.95); } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); } }
  .vit-rot { position: relative; transform-style: preserve-3d; touch-action: none; cursor: grab; width: min(78vw, 330px); z-index: 1; }
  .vit-perso { animation: respire 4.2s ease-in-out infinite; transform-origin: 50% 95%; }
  .vit-perso svg { width: 100%; height: auto; display: block; }
  .vit-perso.salut { animation: salut .7s ease-out, respire 4.2s ease-in-out .7s infinite; }
  @keyframes respire { 0%,100% { transform: scale(1,1) translateY(0); } 50% { transform: scale(1.008,1.022) translateY(-3px); } }
  @keyframes salut { 0% { transform: translateY(0); } 30% { transform: translateY(-22px) rotate(-3deg); } 55% { transform: translateY(0) scale(1.03,.97); } 75% { transform: translateY(-6px); } 100% { transform: translateY(0); } }
  .vit-ombre { position: absolute; bottom: 8px; left: 50%; width: 46%; height: 14px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%); animation: ombre 4.2s ease-in-out infinite; }
  @keyframes ombre { 0%,100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(.94); } }
  .vit-parts i { position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: #9fe4ff; box-shadow: 0 0 8px #9fe4ff; opacity: 0; animation: monte 6s linear infinite; }
  .vit-scene.voleur .vit-parts i { background: #c79bff; box-shadow: 0 0 8px #c79bff; }
  @keyframes monte { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-420px); opacity: 0; } }
  .vit-scene.calme *, .vit-scene.calme::before { animation: none !important; }
  .vit-aide { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 18px; }
  .orn-slot h4 { margin: 14px 0 8px; font: 600 14px var(--f-recit); color: var(--gold); } .orn-slot h4 span { font: 400 12px system-ui, sans-serif; color: var(--muted); margin-left: 6px; }
  .orn-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
  .orn-t { position: relative; }

  summary::-webkit-details-marker { display: none; }

  .stat { display: grid; grid-template-columns: 26px 1fr 44px 34px; align-items: center; gap: 8px; padding: 7px 0; font-size: 13px; }
  .stat .bar { height: 6px; }

  .stat .nm { font-size: 12px; color: var(--muted); margin-bottom: 3px; }

  /* Menu d'actions */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
  .sheet-bg.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--panel);
    border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 16px 28px;
    transform: translateY(105%); visibility: hidden; transition: transform .25s cubic-bezier(.2,.8,.2,1), visibility 0s .25s;
    max-width: 520px; margin: 0 auto; }
  .sheet.on { transform: none; visibility: visible; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .sheet h3 { margin: 0 0 12px; font-size: 15px; }
  .sheet button { width: 100%; padding: 14px; margin-top: 8px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font: 600 15px Inter, sans-serif; text-align: left; cursor: pointer; }
  .sheet button.cancel { text-align: center; background: transparent; color: var(--muted); }

  /* Retours visuels */
  .float { position: fixed; left: 50%; top: 40%; transform: translate(-50%, 0); z-index: 20;
    font-family: var(--f-titre); font-weight: 800; font-size: 28px; pointer-events: none; white-space: nowrap;
    animation: rise 2.9s ease-out forwards; text-shadow: 0 2px 12px rgba(0,0,0,.6); white-space: normal; text-align: center; width: max-content; max-width: 92vw; }
  @keyframes rise { 0% { opacity: 0; transform: translate(-50%, 20px) scale(.8); }
    8% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    14% { transform: translate(-50%, 0) scale(1); }
    75% { opacity: 1; transform: translate(-50%, -18px) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); } }
  .lvl-ov { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; overflow: hidden; overscroll-behavior: contain;
    background: radial-gradient(circle at 50% 24%, #3a2c12 0%, #120d1a 42%, #07050b 100%); animation: lvlIn .45s ease-out; }
  .lvl-ov.sortie { animation: lvlOut .4s ease-in forwards; }
  @keyframes lvlIn { from { opacity: 0; } } @keyframes lvlOut { to { opacity: 0; transform: scale(1.04); } }
  .lvl-rayons { position: absolute; left: 50%; top: 24%; width: 900px; height: 900px; margin: -450px 0 0 -450px; opacity: .22;
    background: repeating-conic-gradient(from 0deg, rgba(212,173,60,.5) 0 4deg, transparent 4deg 18deg); -webkit-mask: radial-gradient(circle, #000 0, transparent 60%); mask: radial-gradient(circle, #000 0, transparent 60%);
    animation: lvlTourne 24s linear infinite, lvlIn 1.2s ease-out; }
  @keyframes lvlTourne { to { transform: rotate(360deg); } }
  .lvl-eclats { position: absolute; left: 50%; top: 24%; width: 0; height: 0; }
  .lvl-eclats i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffe6a0; box-shadow: 0 0 8px #ffd56a; opacity: 0;
    animation: lvlEclat 1.4s cubic-bezier(.15,.7,.3,1) calc(1.05s + var(--d)) forwards; transform: rotate(var(--a)) translateY(0); }
  @keyframes lvlEclat { 0% { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(1.4); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(calc(-1 * var(--l))) scale(.4); } }
  .lvl-box { position: relative; width: min(92vw, 380px); max-height: 92vh; overflow-y: auto; text-align: center; padding: 8px 4px 18px; }
  .lvl-anneau { position: relative; width: 168px; height: 168px; margin: 0 auto 6px; }
  .lvl-anneau svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .lvl-anneau circle { fill: none; stroke-width: 7; } .lvl-anneau .fond { stroke: rgba(255,255,255,.08); }
  .lvl-anneau .plein { stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 327; stroke-dashoffset: 327; filter: drop-shadow(0 0 6px rgba(212,173,60,.8));
    animation: lvlRemplit 1s cubic-bezier(.4,.1,.2,1) .15s forwards; }
  @keyframes lvlRemplit { to { stroke-dashoffset: 0; } }
  .lvl-num { position: absolute; inset: 0; display: grid; place-content: center; font-family: var(--f-titre); color: var(--gold); }
  .lvl-num small { font-size: 11px; letter-spacing: .25em; color: var(--muted); }
  .lvl-num b { font-size: 64px; line-height: 1; font-weight: 800; text-shadow: 0 0 18px rgba(212,173,60,.6); }
  .lvl-num b.pop { animation: lvlPop .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes lvlPop { 0% { transform: scale(.4); opacity: .2; } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .lvl-perso { position: absolute; right: -22px; bottom: -6px; width: 64px; opacity: 0; animation: lvlMonte .6s ease-out 1.3s forwards; }
  .lvl-perso svg { width: 100%; height: auto; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  @keyframes lvlMonte { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .lvl-box h2 { font-family: var(--f-titre); color: var(--gold); font-size: 24px; letter-spacing: .04em; margin: 6px 0 2px; opacity: 0; animation: lvlMonte .5s ease-out 1.2s forwards; }
  .lvl-sous { color: var(--muted); font-size: 13px; margin: 0 0 12px; opacity: 0; animation: lvlMonte .5s ease-out 1.3s forwards; }
  .lvl-recap { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 7px; text-align: left; }
  .lvl-recap li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 9px 11px; font-size: 14px; opacity: 0; animation: lvlMonte .45s ease-out calc(1.5s + var(--i) * .16s) forwards; }
  .lvl-recap li i { font-style: normal; font-size: 18px; text-align: center; } .lvl-recap b { color: var(--gold); }
  .lvl-recap small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .lvl-box .btn { opacity: 0; animation: lvlMonte .4s ease-out 2.2s forwards; min-width: 160px; }
  @keyframes fade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 200; max-width: min(92vw, 440px); width: max-content;
    background: #3a1f1f; color: #ffc2c2; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.4; display: none; text-align: center;
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 8px 26px rgba(0,0,0,.5); animation: toastIn .25s ease-out; }
  .toast.erreur { background: #3a1f1f; color: #ffc2c2; border-color: rgba(224,85,85,.55); }
  .toast.erreur::before { content: '⚠️ '; }
  .toast.info { background: #2f2614; color: #f3dca6; border-color: rgba(224,160,64,.45); }
  .toast.ok { background: #18291f; color: #c9f0d4; border-color: rgba(79,191,122,.5); }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }
  .loading { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  .demo { text-align: center; font-size: 11px; color: var(--warn); padding-top: 10px; }

  /* Profil */
  .back { margin: 16px 0 0; padding: 6px 0; border: 0; background: none; color: var(--gold); font: 600 14px Inter, sans-serif; cursor: pointer; }
  .id-card { margin-top: 10px; display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
  .id-card svg { width: 92px; height: auto; display: block; }
  .id-card .nm { font-family: var(--f-titre); font-size: 18px; font-weight: 800; }
  .id-card .tt { color: var(--gold); font-size: 13px; margin-top: 2px; }
  .devise { margin-top: 8px; font-style: italic; font-size: 13px; color: #d9cfe6; line-height: 1.4; }
  .devise.vide { color: var(--muted); }
  .lien { border: 0; background: none; color: var(--gold); font: 600 12px Inter, sans-serif; padding: 4px 0 0; cursor: pointer; }
  .grid-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .grid-wrap canvas { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .grid-info { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .grid-info b { color: var(--text); }
  .legende { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 10px; font-size: 11px; color: var(--muted); }
  .legende i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .records { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .rec { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .rec b { display: block; font-family: var(--f-titre); font-size: 19px; color: var(--gold); }
  .rec span { font-size: 11px; color: var(--muted); line-height: 1.35; display: block; }
  .histoire { font-size: 13px; line-height: 1.55; color: #ddd3ea; padding: 10px 0; }
  .histoire p { margin: 0 0 8px; } .histoire p:last-child { margin: 0; color: var(--muted); font-size: 12px; }
  .evo { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .evo:last-child { border-bottom: 0; }
  .evo .lv { flex: none; width: 46px; text-align: center; font-family: var(--f-titre); font-weight: 800; color: var(--gold); font-size: 12px; }
  .evo.lock { opacity: .45; } .evo.ici { background: rgba(212,173,60,.08); margin: 0 -14px; padding: 9px 14px; }
  .evo b { display: block; } .evo span { color: var(--muted); font-size: 12px; }
  .reg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .reg h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
  .reg .aide { font-size: 12px; color: var(--muted); line-height: 1.45; margin-bottom: 8px; }
  .reg .ligne { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .reg .ligne:first-of-type { border-top: 0; }
  .reg input[type=date], .reg select, .reg input[type=text] { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 8px; font: 13px Inter, sans-serif; min-width: 0; }
  .reg .form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 6px; }
  .reg .form label { font-size: 11px; color: var(--muted); display: grid; gap: 4px; }
  .btn { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text);
    font: 600 13px Inter, sans-serif; cursor: pointer; }
  .btn.or { border-color: #6a5320; background: #2b2410; color: var(--gold); }
  .btn.plein { width: 100%; margin-top: 8px; }
  .btn.mini { padding: 5px 10px; min-height: 38px; font-size: 12px; }
  .btn:disabled { opacity: .45; }
  .sw { position: relative; width: 44px; height: 26px; flex: none; }
  .sw input { opacity: 0; width: 0; height: 0; }
  .sw span { position: absolute; inset: 0; background: #3a3145; border-radius: 13px; transition: .2s; }
  .sw span::before { content: ''; position: absolute; width: 20px; height: 20px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .sw input:checked + span { background: var(--gold); }
  .sw input:checked + span::before { transform: translateX(18px); }
  .modes { display: grid; gap: 6px; }
  .mode { text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; font: 13px Inter, sans-serif; }
  .mode b { display: block; margin-bottom: 2px; } .mode span { font-size: 12px; color: var(--muted); }
  .mode.on { border-color: var(--gold); background: #2b2410; } .mode.on b { color: var(--gold); }
  .mode:disabled:not(.on) { opacity: .45; }
  .pause-note { display: block; width: 100%; margin-top: 14px; padding: 10px; border-radius: 12px; border: 1px dashed var(--line);
    background: transparent; color: var(--muted); font: 13px Inter, sans-serif; cursor: pointer; }
  .chip.d { background: #1f2a3a; color: #9fc2ef; }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="loading">Chargement de ta feuille de personnage…</div></div>
</div>

<div id="carnetBox" hidden></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <h3 id="sheetTitle"></h3>
  <button data-act="Fait">✅ Fait</button>
  <button data-act="hier">⏪ C'était hier (oubli de saisie)</button>
  <button data-act="Raté">❌ Raté (−PV)</button>
  <button data-act="Repos" id="btnRepos">💤 Repos (utilise le joker de la semaine)</button>
  <button data-act="undo">↩️ Annuler la dernière saisie du jour</button>
  <button data-act="jour" id="btnJour" style="display:none">📅 Changer de jour (cette semaine)</button>
  <button data-act="renommer">✏️ Renommer la quête</button>
  <button class="cancel" data-act="close">Fermer</button>
</div>
<div class="sheet" id="sheetPal"></div>
<div class="toast" id="toast"></div>
<div class="d20-ov" id="d20ov"></div>

<script>
/* Magicien : personnage SVG par calques, 8 paliers (0 = niveau 1 … 7 = niveau 100) */
const PALIERS_MAGE = [
  { n: 1, titre: "l'Apprenti", desc: 'Robe de laine, baguette de bois, premier grimoire.' },
  { n: 5, titre: "l'Aventurier", desc: 'Robe bleue, chapeau pointu, bâton de voyage.' },
  { n: 10, titre: 'le Vagabond', desc: 'Grand manteau, bâton à cristal, parchemins à la ceinture.' },
  { n: 20, titre: 'le Chevalier', desc: 'Robe de mage de bataille, mantelet, runes dorées.' },
  { n: 35, titre: 'le Champion', desc: 'Cristal lumineux, grimoire flottant, première aura.' },
  { n: 50, titre: 'le Héros', desc: 'Robe d\'archiviste violette, chapeau étoilé, aura dorée.' },
  { n: 75, titre: 'le Légendaire', desc: 'Regard arcanique, cercle de runes sous les pieds.' },
  { n: 100, titre: "l'Ascendant", desc: 'Lévitation, halo de lumière, trois orbes en orbite.' }
];
function palierMage(niveau) {
  let i = 0;
  PALIERS_MAGE.forEach((p, k) => { if (niveau >= p.n) i = k; });
  return i;
}

function magicien(st, id) {
  const C = {
    peau: '#e3bd98', cheveux: '#3b2a20',
    robe: ['#86735c', '#3456a6', '#3456a6', '#2f48a0', '#2f48a0', '#5a2f96', '#4c2a8c', '#45267f'][st],
    robeOmbre: ['#5a4a38', '#1f3470', '#1f3470', '#1b2c66', '#1b2c66', '#331a5c', '#2a1652', '#25134a'][st],
    peauOmbre: '#c0916c', yeux: '#6b4a2c',
    manteau: '#3a2a5a', manteauOmbre: '#261a3e', or: '#d4ad3c', cuir: '#5a3a22',
    cristal: st >= 7 ? '#fffbe6' : st >= 4 ? '#8ff0ff' : '#9fd6e8', bois: '#6a4426'
  };
  const auraCol = st >= 7 ? '#fff3c4' : st >= 5 ? '#c9a2ff' : '#7fd6ff';
  const lev = st >= 7 ? -10 : 0; // lévitation au palier ultime
  let s = `<svg viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Magicien, palier ${st + 1}">
  <defs>
    <radialGradient id="mau${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${auraCol}" stop-opacity="${st >= 7 ? .7 : .45}"/>
      <stop offset="60%" stop-color="${auraCol}" stop-opacity="${st >= 7 ? .22 : .12}"/>
      <stop offset="100%" stop-color="${auraCol}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mcr${id}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="45%" stop-color="${C.cristal}"/><stop offset="100%" stop-color="${C.cristal}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mro${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${C.robe}"/><stop offset="100%" stop-color="${C.robeOmbre}"/>
    </linearGradient>
    <linearGradient id="mlat${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".16"/><stop offset="35%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="65%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="mvis${id}" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity=".10"/><stop offset="45%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="70%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="mhs${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity=".38"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mfc${id}"><path d="M85.5,72 Q85.5,57 100,57 Q114.5,57 114.5,72 Q114.5,82 110,88 Q105,94.5 100,94.5 Q95,94.5 90,88 Q85.5,82 85.5,72Z"/></clipPath>
  </defs>`;

  // Aura (35+)
  if (st >= 4) s += `<circle class="aura" cx="100" cy="${140 + lev}" r="${st >= 7 ? 98 : st >= 5 ? 88 : 78}" fill="url(#mau${id})"/>`;
  // Halo (100)
  if (st >= 7) s += `<g class="spin" style="transform-origin:100px 66px"><circle cx="100" cy="66" r="40" fill="none" stroke="#fff3c4" stroke-width="2" stroke-dasharray="6 5" opacity=".8"/></g>
    <circle cx="100" cy="66" r="30" fill="none" stroke="#ffe9a0" stroke-width="1.2" opacity=".6"/>`;
  // Cercle de runes au sol (75+)
  if (st >= 6) {
    let runes = '';
    for (let i = 0; i < 12; i++) {
      const a = i * 30 * Math.PI / 180, x = 100 + Math.cos(a) * 52, y = 242 + Math.sin(a) * 11;
      runes += `<path d="M${x - 2},${y} l2,-3 l2,3 z" fill="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}"/>`;
    }
    s += `<g class="eyes"><ellipse cx="100" cy="242" rx="58" ry="13" fill="none" stroke="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}" stroke-width="1.5"/>
      <ellipse cx="100" cy="242" rx="46" ry="9" fill="none" stroke="${st >= 7 ? '#ffe9a0' : '#c9a2ff'}" stroke-width="1" stroke-dasharray="3 3"/>${runes}</g>`;
  } else {
    s += `<ellipse cx="100" cy="243" rx="${st >= 5 ? 50 : 42}" ry="7" fill="#000" opacity=".45"/>`;
  }

  s += `<g transform="translate(0,${lev})">`;
  // Manteau (10+) derrière
  if (st >= 2) s += `<g class="cape"><path d="M78,100 L${st >= 5 ? 52 : 58},236 Q100,244 ${st >= 5 ? 148 : 142},236 L122,100 Z" fill="${C.manteau}"/>
    <path d="M122,100 L${st >= 5 ? 148 : 142},236 L${st >= 5 ? 132 : 128},238 L118,104Z" fill="#000" opacity=".25"/>
    <path d="M78,100 L${st >= 5 ? 52 : 58},236" stroke="#fff" stroke-width="1.2" opacity=".15"/>
    ${st >= 3 ? `<path d="M${st >= 5 ? 52 : 58},236 Q100,244 ${st >= 5 ? 148 : 142},236" fill="none" stroke="${C.or}" stroke-width="2.5"/>` : ''}</g>`;

  // Bâton (5+) à droite, derrière la main
  if (st >= 1) {
    const haut = st >= 2 ? 56 : 92;
    s += `<path d="M136,${haut} L134,238" stroke="${st >= 7 ? '#fff3c4' : C.bois}" stroke-width="${st >= 5 ? 5 : 4}" stroke-linecap="round"/>`;
    if (st >= 2) {
      s += `<path d="M136,${haut + 6} q-8,-8 0,-16 q8,8 0,16z" fill="none" stroke="${st >= 3 ? C.or : C.bois}" stroke-width="2.5"/>
        <path d="M136,${haut - 16} l6,9 l-6,9 l-6,-9z" fill="${C.cristal}"/>`;
      if (st >= 4) s += `<circle class="eyes" cx="136" cy="${haut - 7}" r="${st >= 7 ? 18 : 13}" fill="url(#mcr${id})"/>`;
    } else {
      s += `<circle cx="136" cy="${haut - 2}" r="4" fill="${C.bois}"/>`;
    }
  }

  // Robe longue (cache les jambes)
  s += `<path d="M76,102 Q100,93 124,102 L${st >= 5 ? 138 : 134},236 Q100,244 ${st >= 5 ? 62 : 66},236Z" fill="url(#mro${id})"/>`;
  s += `<path d="M76,102 Q100,93 124,102 L${st >= 5 ? 138 : 134},236 Q100,244 ${st >= 5 ? 62 : 66},236Z" fill="url(#mlat${id})"/>

  return s + '</g></svg>';

/** Classe du héros affiché (tolérant : « Voleur », « Assassin », « Roublard » → voleur assassin). */
function classeDe(s) {
  const nom = String(((s || state || {}).classe || {}).nom || 'Magicien');
  return CLASSES[nom] || (/voleur|assassin|roublard/i.test(nom) ? CLASSES['Voleur assassin'] : CLASSES.Magicien);
}
function palierDe(niveau, cls) {
  let i = 0;
  (cls || classeDe()).paliers.forEach((p, k) => { if (niveau >= p.n) i = k; });
  return i;
}
/** Couleurs du héros (Paramètres → Fiches des héros, colonne Apparence : « peau, cheveux, yeux » en #hex). */
function lookDe(txt) {
  const c = String(txt || '').split(',').map(x => x.trim()).filter(x => /^#[0-9a-f]{6}$/i.test(x));
  if (!c.length) return null;
  const sombre = (h, f) => '#' + [1, 3, 5].map(i => Math.round(parseInt(h.substr(i, 2), 16) * f).toString(16).padStart(2, '0')).join('');
  const L = { peau: c[0], peauOmbre: sombre(c[0], 0.86) };
  if (c[1]) L.cheveux = c[1];
  if (c[2]) L.yeux = c[2];
  return L;
}
const joursDe = s => (s && s.armurerie ? s.armurerie.joursActifs : s && s.joursActifs);

let recitDemande = '';
function carteEvenement(s, lignes) {

  const E = s.evenement; if (!E) return bloc;
  const e = E.actuel || E.prochain; if (!e) return bloc;
  const r = textesClaude['evt|' + e.cle] || {};
  const nom = r.nom || e.nom, texte = r.texte || e.texte;
  if ((enLigne || distant) && !e.texte && recitDemande !== e.cle) {
    recitDemande = e.cle;
    apiFond('recitEvenement').then(x => { if (x && x.texte) { textesClaude['evt|' + e.cle] = x; render(); } }).catch(() => {});
  }
  return bloc + `<div class="evt ${E.actuel ? 'on' : ''}"><div class="evt-t">✨ ${E.actuel ? '' : 'Bientôt · '}${esc(nom)}</div>
    <div class="evt-e">${esc(e.effetTexte)} · ${E.actuel ? "jusqu'au " + dateCourte(e.fin) : 'dès le ' + dateCourte(e.debut)}</div>
    ${texte ? plie(texte, 'evt-x', lignes || 1) : ''}</div>`;
}
function multEvt(s, q, estAnnexe) {
  const B = beneditionActive(s);
  let mb = 1;
  if (B && B.type === 'tout') mb = B.mult;
  else if (B && B.type === 'carac' && (q.carac === B.carac || q.carac2 === B.carac)) mb = B.mult;
  const RB = s.mj && s.mj.rebond && s.mj.rebond.effet;
  if (RB && (RB.type === 'tout' || (RB.type === 'carac' && (q.carac === RB.carac || q.carac2 === RB.carac)))) mb *= RB.mult;
  return mb * multEvt0(s, q, estAnnexe);
}
function multEvt0(s, q, estAnnexe) {
  const e = s.evenement && s.evenement.actuel; if (!e) return 1;
  const f = e.effet;
  if (f.type === 'tout') return f.mult;
  if (f.type === 'annexes' && estAnnexe) return f.mult;
  if (f.type === 'carac' && (q.carac === f.carac || q.carac2 === f.carac)) return f.mult;
  return 1;
}

  return `<div class="section"><h2>Calendrier</h2><span>${C.sansRate > 0 ? `🔥 ${C.sansRate} jour${C.sansRate > 1 ? 's' : ''} sans raté` : '12 dernières semaines'}</span></div>

      ${sem.map(w => w.map(j => `<i class="${cl(j)} ${j.d === s.today ? 'auj' : ''}" title="${tip(j)}"></i>`).join('')).join('')}</div>
    <div class="cal-l"><i class="f1"></i>1 <i class="f2"></i>2 <i class="f3"></i>3 <i class="f4"></i>4+ quêtes · <i class="ra"></i>raté · <i class="va"></i>vacances</div></div>`;
}

function dateLongueCourte(iso) { return versDate(iso).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }); }
function isoPlus(iso, n) { const d = versDate(iso); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
/* ---------- Coups spéciaux des boss (nouvelles règles, à partir du 23/11/2026) ---------- */
const PHASES_BOSS = { enrage: '🔥 Enragé', abois: '💢 Aux abois' };
const ARTICLE_COUP = { carapace: 'la Carapace', regeneration: 'la Régénération', malediction: 'la Malédiction', bouclier: 'le Bouclier', dernierRecours: 'le Dernier recours' };

/** Coup du jour encore actif (ni brisé ni raté par un boss étourdi) */
function coupActif(b) { const c = b && b.statut === 'En cours' && b.coupDuJour; return c && !c.brise && !c.etourdi ? c : null; }
function faitAujourdhui(s) { return (s.habitudes || []).concat(s.annexes || []).some(q => q.jour && q.jour.fait > 0); }
/** La quête q brise-t-elle le coup du jour du boss b (pour le héros de cet écran) ? */
function briseCoup(s, b, q) {
  const c = coupActif(b); if (!c || !q) return false;
  if (c.capacite === 'carapace' || c.capacite === 'regeneration' || c.capacite === 'dernierRecours') return q.carac === b.faible;
  if (c.capacite === 'malediction') return c.cible === s.heros && q.carac === c.remede;
  if (c.capacite === 'bouclier') return !faitAujourdhui(s); // sa part du bouclier : il faut une quête de chacun
  return false;
}
/** Malédiction sur cette quête (XP ×0,85), sauf si elle brise justement la malédiction */
function maudite(s, q) {
  return ['semaine', 'mois'].some(t => { const b = s.boss && s.boss[t], c = coupActif(b);
    return c && c.capacite === 'malediction' && c.cible === s.heros && q.carac === c.carac && !briseCoup(s, b, q); });
}
/** Étiquettes sur les cartes de quête : « 🗡 brise la Carapace », « 💀 maudite », « 🛡 dégâts ÷2 » */
function tagsCoups(s, q) {

  ['semaine', 'mois'].forEach(t => {
    const b = s.boss[t], c = coupActif(b); if (!c) return;
    if (briseCoup(s, b, q)) out.push(c.capacite === 'bouclier' ? '<span class="g brise">🗡 ta part du Bouclier</span>' : `<span class="g brise">🗡 brise ${ARTICLE_COUP[c.capacite] || esc(c.nom)}</span>`);
    else if (c.capacite === 'malediction' && c.cible === s.heros && q.carac === c.carac) out.push('<span class="g maudit">💀 maudite : XP ×0,85</span>');
    else if (c.capacite === 'carapace' && Number(q.dd) > 0 && Number(q.dd) <= 9) out.push('<span class="g maudit">🛡 Carapace : dégâts ÷2</span>');
  });
  return out.join('');
}
/** Bloc « coup du jour / coup de demain / sbire / capacités » de la grande carte du boss */
function blocCoups(b) {

  const c = b.coupDuJour, d = b.coupDemain;
  let h = '';

    const neutre = c.capacite === 'vol' || c.capacite === 'hurlement';
    const etat = c.etourdi ? '<span class="cp-ok">😵 Étourdi : vous avez tant frappé hier que son coup échoue.</span>'
      : neutre ? (c.brise ? '<span class="cp-ok">🙏 Aucun raté pour l\'instant : tenez bon jusqu\'à minuit.</span>'
        : `<span class="cp-ko">${c.capacite === 'vol' ? '🃏 Un raté : il a volé un joker.' : '📢 Un raté : sa riposte compte double.'}</span>`)
      : c.brise ? `<span class="cp-ok">✨ Brisé !${c.breche ? ' Brèche ouverte : vos quêtes frappent +25 % aujourd\'hui.' : ''}</span>`
      : `<span class="cp-contre">🗡 ${esc(c.contre)}</span>`;
    h += `<div class="bc-coup ${c.brise || c.etourdi ? 'brise' : ''}"><b>${c.icone} Aujourd'hui : ${esc(c.nom)}</b><span>${esc(c.annonce)}</span>${etat}</div>`;
  }
  if (d) h += `<div class="bc-coup demain"><b>${d.icone} Demain : ${esc(d.nom)}</b><span>${esc(d.annonce)}</span><span class="cp-contre">🗡 ${esc(d.contre)}</span></div>`;
  if (b.sbire && !b.sbire.vaincu) h += `<div class="bc-sbire"><span>👹 Sbire : ${Math.round(b.sbire.pv)} / ${Math.round(b.sbire.pvMax)} PV · vos coups le frappent d'abord</span><div class="bar sbire"><i style="width:${b.sbire.pvMax ? Math.max(0, Math.min(100, b.sbire.pv / b.sbire.pvMax * 100)) : 0}%"></i></div></div>`;
  else if (b.sbire && b.sbire.vaincu) h += '<div class="bc-sbire ok">👹 Sbire abattu : +20 XP chacun</div>';
  if (b.capacites && b.capacites.length) h += `<div class="bc-capa">Ses capacités : ${b.capacites.map(x => `${x.icone} ${esc(x.nom)}`).join(' · ')}</div>`;
  return h;
}
/** Petit éclat doré (coup brisé) ou secousse violette (coup subi) sur la carte du boss */
function effetCoup(type) {

}
function regleBoss(s) {
  const R = (s.boss && s.boss.regles) || {};
  const f = x => String(x).replace('.', ',');
  return `<div class="aide-coop">Chaque quête accomplie frappe le boss avec l'XP gagnée : ×${f(estMage(s) ? R.faibleMage : R.faible)} sur sa faiblesse, ×${f(R.resiste)} sur sa résistance${estMage(s) ? `, ×${f(R.sort)} avec le sort préparé` : `, ×${f(R.annexeRoublard)} sur les quêtes annexes`}. Chaque raté lui rend ${Math.round((R.ripSemaine || 0) * 100)} % de ses PV.</div>`;
}
/** Tag faiblesse / résistance sur les cartes de quête */
function tagBoss(q) {
  const b = state && state.boss && state.boss.semaine;
  if (!b || b.statut !== 'En cours') return '';
  return q.carac === b.faible ? ' · <span class="faible">⚡ faiblesse</span>' : q.carac === b.resiste ? ' · <span class="resiste">🛡 résiste</span>' : '';
}
/** Dégâts d'une quête sur un boss (même calcul que l'onglet Combats) */
function degatsQuete(s, b, q, dXp, estAnnexe) {
  const R = s.boss.regles || {}, mage = estMage(s), capa = s.capacites || {};
  const f = q.carac === b.faible ? (mage ? R.faibleMage : R.faible) : q.carac === b.resiste ? R.resiste : 1;
  // Nouvelles règles : Carapace (quêtes DD 9 ou moins ÷2, sauf celle qui la brise), Brèche (+25 % après un coup brisé)
  const c = b.coupDuJour, dd = Number(q.dd) || 0;
  const k = (c && c.capacite === 'carapace' && coupActif(b) && !briseCoup(s, b, q) && dd > 0 && dd <= 9 ? 0.5 : 1) * (c && c.breche ? 1.25 : 1);
  return Math.round(dXp * f * k * (mage && capa.sortPrepare === q.nom ? R.sort : 1) * (!mage && estAnnexe ? R.annexeRoublard : 1));
}
const bossFetes = {};
/**
 * Boss vaincu : cinématique d'exécution.
 * La Compagnie entre en scène de part et d'autre du boss, chaque héros porte un coup (entaille lumineuse),
 * puis l'assaut commun : éclair blanc, le boss se fissure et part en éclats. Le récap s'affiche ensuite.
 * Toucher l'écran passe directement au récap. Sans animations (réglages), seul le récap s'affiche.
 */
function bossVaincu(b, revoir) {
  if (!b || (bossFetes[b.nom] && !revoir)) return;
  bossFetes[b.nom] = true;
  document.querySelectorAll('.boss-win').forEach(x => x.remove());
  const anim = confort().animations && !matchMedia('(prefers-reduced-motion: reduce)').matches;
  // les héros de la Compagnie : toi + ton (tes) compagnon(s)
  let heros = [];
  try {
    const CL = classeDe(state);
    heros.push({ nom: String(state.heros || '').split(' ')[0], svg: avatar(palierDe(Number(state.niveau) || 1, CL), 'bwm', state) });
    (state.compagnons || []).slice(0, 1).forEach(c => {
      const cl = classeDe({ classe: { nom: c.classe } });
      heros.push({ nom: String(c.nom || '').split(' ')[0], svg: cl.dessin(palierDe(Number(c.niveau) || 1, cl), 'bwc', lookDe(c.look)) });
    });
  } catch (e) { heros = []; }
  // Chaque boss tombe à sa façon : il coule (eau), part en fumée (ombre), s'effondre (pierre), explose (feu) ou s'envole en feuilles (nature)
  const mort = MORT_BOSS[b.visuel] || 'eclat', M = MORTS[mort];
  const eclats = Array.from({ length: 28 }, (_, i) => {
    const ang = (i / 28) * Math.PI * 2 + (i % 3) * .2, dist = 90 + (i * 37) % 110;
    const dy = mort === 'pierre' ? Math.abs(Math.sin(ang) * dist) + 40 : mort === 'ombre' || mort === 'nature' ? -Math.abs(Math.sin(ang) * dist) - 40 : Math.sin(ang) * dist - 20;
    return `<i class="bw-p" style="--dx:${Math.round(Math.cos(ang) * dist)}px;--dy:${Math.round(dy)}px;--r:${(i * 47) % 360}deg;background:${M.c[i % M.c.length]}"></i>`;
  }).join('') + `<div class="bw-fx">${Array.from({ length: 10 }, (_, i) => `<i style="--x:${(i * 37) % 100 - 50}px;--d:${(i % 5) * .12}s">${M.e[i % M.e.length]}</i>`).join('')}</div>`;
  /* Animation de victoire (app 4.0) : ~5,5 s. Les héros frappent l'un après l'autre (la barre de vie se vide),
     coup final commun (l'écran tremble), le boss se brise dans la lumière, puis le tampon « VICTOIRE » et le récap.
     Toucher l'écran ne coupe plus l'animation : bouton « Passer ». Rejouable depuis la carte du boss vaincu. */
  const nomG = heros[0] ? heros[0].nom : 'Toi', nomD = heros[1] ? heros[1].nom : nomG;
  const rayons = Array.from({ length: 12 }, (_, i) => `<i style="--a:${i * 30}deg"></i>`).join('');
  const el = document.createElement('div');
  el.className = 'boss-win mort-' + mort + (anim ? ' anim' : ' fin');
  el.innerHTML = `${anim ? '<button class="bw-passer" data-bw-passer="1">Passer ›</button>' : ''}<div class="bw-box">
    ${anim ? `<div class="bw-scene">
      <div class="bw-rayons">${rayons}</div>
      <div class="bw-nom">${esc(b.nom)}</div>
      <div class="bw-vie"><i></i></div>
      <div class="bw-boss"><div class="bw-bi">${bossSvg(b.visuel, 'win', b)}</div>
        <span class="bw-slash s1"></span><span class="bw-slash s2"></span><span class="bw-slash s3"></span><span class="bw-slash s4"></span>${eclats}
        <b class="bw-coup c1">⚔ ${esc(nomG)}</b><b class="bw-coup c2">⚔ ${esc(nomD)}</b><b class="bw-coup c3">COUP FINAL !</b></div>
      ${heros.map((h, i) => `<div class="bw-h ${i ? 'd' : 'g'}"><div class="bw-hi">${h.svg}</div><small>${esc(h.nom)}</small></div>`).join('')}
      <div class="bw-flash"></div>
      <div class="bw-tampon">VICTOIRE</div>
    </div>` : `<div class="bw-svg">${bossSvg(b.visuel, 'win', b)}</div>`}
    <div class="bw-txt"><h3>BOSS VAINCU !</h3>
    <p>${esc(b.nom)} ${b.type === 'mois' ? 'est repoussé jusqu\'au mois prochain' : 'tombe sous les coups de la Compagnie'}.</p>
    ${b.xp ? `<p class="bw-xp">+${b.xp} XP pour toi · ton compagnon reçoit aussi sa part</p>` : ''}
    ${b.trophee ? `<p class="bw-tr">Trophée : ${esc(b.trophee)}</p>` : ''}
    <div class="row" style="justify-content:center;gap:8px">${anim ? '<button class="btn" data-bw-rejouer="1">↻ Revoir</button>' : ''}
    <button class="btn or plein" data-bw="1">${b.type === 'mois' ? 'Gloire à la Compagnie' : 'À la semaine prochaine…'}</button></div></div></div>`;
  document.body.appendChild(el);
  const minuteurs = [];
  if (anim) {
    [[1500, [60]], [2400, [60]], [3300, [140, 40, 220]], [4450, [40, 30, 40]]].forEach(([t, v]) => minuteurs.push(setTimeout(() => vib(v), t)));
    minuteurs.push(setTimeout(() => el.classList.add('fin'), 5300));
    minuteurs.push(setTimeout(effetCoupDeGrace, 3250));
  } else vib([80, 40, 80, 40, 200]);
  el.addEventListener('click', e => {
    if (e.target.closest('[data-bw]')) { minuteurs.forEach(clearTimeout); el.remove(); return; }
    if (e.target.closest('[data-bw-rejouer]')) { minuteurs.forEach(clearTimeout); el.remove(); bossVaincu(b, true); return; }
    if (e.target.closest('[data-bw-passer]')) { minuteurs.forEach(clearTimeout); el.classList.add('fin', 'saute'); }
  });
}

function carteD20(s) {
  if (!s.d20) return `<button class="d20-card" data-d20="1">${d20Svg('?')}Lance ton d20 du jour<span>→</span></button>`;
  const d = s.d20;
  return `<button class="d20-card fait ${d.mult < 1 ? 'malus' : ''}" data-d20="1">${d20Svg(d.de)}<div><b>${esc(d.titre)}</b><br>${d.mult !== 1 ? `XP ×${String(d.mult).replace('.', ',')} sur tes quêtes du jour` : 'Ni bonus ni malus aujourd\'hui'}</div></button>`;
}
let d20Vu = false;
function ouvrirD20() {
  d20Vu = true;
  const s = state, ov = document.getElementById('d20ov');
  const carac = (s.classe && s.classe.fav1) || '';
  const deja = s.d20;
  ov.innerHTML = `<div class="d20-box">
      <h2>🎲 Le d20 du jour</h2>
      <p class="d20-sub">Un jet par jour, plus ton modificateur de ${esc(carac || 'caractéristique')}.<br>Comme en D&D : 8-9 → −1, 10-11 → +0, 12-13 → +1, 14-15 → +2…<br>Il multiplie l'XP de toutes tes quêtes du jour.</p>
      <div id="d20zone">${d20Svg(deja ? deja.de : '?', deja ? (deja.de === 20 ? 'crit' : deja.de === 1 ? 'fumble' : '') : '')}</div>
      <div class="d20-res" id="d20res">${deja ? resultatD20Html(deja) : ''}</div>
      <button class="btn or plein" id="d20go">${deja ? 'À l\'aventure !' : 'Lancer le dé'}</button>

      <div class="d20-table">1 naturel : échec critique ×0,8 · 2-9 : ×1 · 10-17 : ×1,1<br>18 et plus : ×1,25 · 20 naturel : coup critique ×1,5</div>
    </div>`;
  ov.classList.add('on');
}
function resultatD20Html(d) {
  const cl = d.de === 20 ? 'crit' : d.de === 1 ? 'fumble' : '';
  const detail = `${COURT_MOD(d.mod)} ${esc((COURT[d.carac] || d.carac || '').toString())}`;
  return `${d.avantage ? `<div class="calc" style="font-size:13px">Avantage : ${d.avantage[0]} et ${d.avantage[1]}, tu gardes ${d.de}</div>` : ''}<div class="calc">${d.de} ${detail} = <b>${d.total}</b></div>
    <div class="titre ${cl}">${esc(d.titre)}</div><div class="texte">${esc(d.texte)}</div>

}
function fermerD20() { document.getElementById('d20ov').classList.remove('on'); }
/* Le dé est tiré sur le téléphone : résultat en 1 seconde, sans attendre le Sheet (qui l'enregistre ensuite avec les mêmes règles) */
function d20Local(s, d1, d2) {
  const carac = (s.classe && s.classe.fav1) || '';
  const st = (s.stats || []).find(x => x.nom === carac);
  const mod = st ? Math.floor((Number(st.score) - 10) / 2) : 0;
  const E = s.evenement && s.evenement.actuel, B = beneditionActive(s);
  const avantage = !!((E && E.effet && E.effet.type === 'avantage') || (B && B.type === 'avantage'));
  const de = avantage ? Math.max(d1, d2) : d1, total = de + mod;
  const r = de === 20 ? { mult: 1.5, titre: 'COUP CRITIQUE !', texte: 'Les dieux sont avec toi : XP ×1,5 sur toutes tes quêtes du jour.' }
    : de === 1 ? { mult: 0.8, titre: 'Échec critique…', texte: 'XP ×0,8 aujourd\'hui : le destin rit, à toi de lui prouver qu\'il a tort.' }
    : total >= 18 ? { mult: 1.25, titre: 'Inspiration héroïque', texte: 'XP ×1,25 sur toutes tes quêtes du jour.' }
    : total >= 10 ? { mult: 1.1, titre: 'Bon présage', texte: 'XP ×1,1 sur toutes tes quêtes du jour.' }
    : { mult: 1, titre: 'Journée ordinaire', texte: 'Ni bonus ni malus : aujourd\'hui, c\'est toi qui fais la différence.' };
  return Object.assign({ de, mod, carac, total, avantage: avantage ? [d1, d2] : null }, r);
}
function afficherD20(d) {
  const zone = document.getElementById('d20zone'), res = document.getElementById('d20res');
  if (zone) zone.innerHTML = d20Svg(d.de, d.de === 20 ? 'crit' : d.de === 1 ? 'fumble' : 'pose');
  if (res) res.innerHTML = resultatD20Html(d);
}
async function lancerDe() {
  const btn = document.getElementById('d20go'), later = document.getElementById('d20later');
  if (state.d20) { fermerD20(); return; }
  btn.disabled = true; btn.textContent = 'Le dé roule…'; if (later) later.remove();
  const zone = document.getElementById('d20zone');
  // Lancer sur une table : le dé arrive de la gauche, rebondit deux fois en roulant, puis se pose
  zone.innerHTML = d20Svg('?', '');
  const de = zone.querySelector('svg');
  const txt = () => de.querySelector('text');
  const tic = setInterval(() => { const t = txt(); if (t) t.textContent = 1 + Math.floor(Math.random() * 20); }, 55);
  const anim = confort().animations && de.animate ? de.animate([
    { transform: 'translate(-110px,-70px) rotate(-320deg) scale(.85)', easing: 'cubic-bezier(.5,0,1,1)' },
    { transform: 'translate(-55px,0) rotate(-150deg) scale(.95)', offset: .32, easing: 'cubic-bezier(0,0,.5,1)' },
    { transform: 'translate(-30px,-26px) rotate(-70deg)', offset: .48, easing: 'cubic-bezier(.5,0,1,1)' },
    { transform: 'translate(-12px,0) rotate(-18deg)', offset: .64, easing: 'cubic-bezier(0,0,.5,1)' },
    { transform: 'translate(-5px,-8px) rotate(-6deg)', offset: .76, easing: 'cubic-bezier(.5,0,1,1)' },
    { transform: 'translate(0,0) rotate(3deg)', offset: .88 },
    { transform: 'translate(0,0) rotate(0)' }
  ], { duration: 1100 }) : null;
  if (anim) [.32, .64, .88].forEach((o, k) => setTimeout(() => vib(k === 2 ? 15 : 30), o * 1100)); // les « toc » sur la table
  const d1 = 1 + Math.floor(Math.random() * 20), d2 = 1 + Math.floor(Math.random() * 20);
  const local = d20Local(state, d1, d2);
  // le Sheet enregistre le jet pendant que le dé roule (ou plus tard, s'il n'y a pas de réseau)
  const jet = { id: nouvelId(), type: 'd20', d1, d2, date: isoLocal() };
  const horsLigne = lireAttente().length || navigator.onLine === false;
  const envoi = horsLigne ? Promise.reject(new Error('Pas de connexion au Sheet (réseau)')) : api('lancerD20', { d1, d2 });
  envoi.catch(() => {});
  await (anim ? anim.finished : pause(200));
  clearInterval(tic);
  state.d20 = local;
  afficherD20(local);
  vib(local.de === 20 ? [80, 50, 80, 50, 200] : local.de === 1 ? [200] : [40]);
  btn.disabled = false; btn.textContent = 'À l\'aventure !';
  render();
  envoi.then(res => {
    const d = res && res.d20;
    if (envoisEnCours === 0) { state = avecAttente(res); confirme = null; } else confirme = res;
    if (d && (d.de !== local.de || d.texte !== local.texte)) {
      if (document.getElementById('d20ov').classList.contains('on')) afficherD20(d);
      if (d.de !== local.de) toast('Ton dé du jour avait déjà été lancé sur un autre appareil : ' + d.de);
    }
    render();
  }).catch(e => {
    if (estHorsLigne(e)) { // le résultat reste : il sera enregistré au retour du réseau
      mettreEnAttente(jet);
      return;
    }
    state.d20 = null; render();
    if (document.getElementById('d20ov').classList.contains('on')) { btn.textContent = 'Lancer le dé'; zone.innerHTML = d20Svg('?', ''); document.getElementById('d20res').innerHTML = ''; }
    toast('Le dé s\'est perdu (pas de réponse du Sheet) : relance-le dans un instant');
  });
}
document.addEventListener('click', e => {
  if (e.target.closest('[data-d20]')) { ouvrirD20(); return; }
  if (e.target.id === 'd20go') { lancerDe(); return; }
  if (e.target.id === 'd20later') { fermerD20(); }
});

/* Quêtes à paliers (colonne « Palier de » du Sheet) : une seule carte, un seul palier validé par mois */
function regrouperPaliers(liste) {
  const sortie = [], vus = {};
  liste.forEach(a => {
    if (!a.groupe || a.jour.fait || a.jour.rate || a.jour.repos) { sortie.push(a); return; }
    if (!vus[a.groupe]) { vus[a.groupe] = { groupe: a.groupe, membres: [] }; sortie.push(vus[a.groupe]); }
    vus[a.groupe].membres.push(a);
  });
  return sortie.map(g => g.membres && g.membres.length === 1 ? g.membres[0] : g);
}
function carteGroupe(g) {
  const m = g.membres.slice().sort((x, y) => x.xp - y.xp), a = m[0];
  return `<div class="card annexe" data-groupe="${esc(g.groupe)}">
    <div class="icon">${ICONES[a.carac] || '⭐'}</div>
    <div class="body">
      <div class="name">${esc(g.groupe)}${a.finDeMois ? ' · ' + moisNom(a.moisBilan) : ''}</div><div class="sous">${m.length} paliers · tu en valides un seul</div>
      <div class="meta"><span class="bonus">+${m[0].xp} à +${m[m.length - 1].xp} XP</span> · ${caracs(a)} · ${a.finDeMois ? 'jusqu\'au 5 du mois suivant' : 'une fois par mois'}</div>
    </div>

  </div>`;
}

function carteEpique(o) {

function carteBilan(s, dimanche) {
  if (!s.bilan || !s.bilan.semaine || !s.bilan.precedente) return '';
  const b = s.bilan.semaine, pr = s.bilan.precedente;
  const delta = pr.xp ? Math.round((b.xp - pr.xp) / pr.xp * 100) : null;
  const tendance = delta === null ? '' : `<div class="${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} % vs sem. dern.</div>`;
  const meilleure = s.habitudes.reduce((m, h) => (h.serieNb > 0 && h.serie > m.serie ? h : m), { serie: 0 });
  let mot;
  if (b.aJour === b.total && b.total) mot = 'Semaine parfaite : toutes tes habitudes sont à jour. Légendaire.';
  else if (b.rates === 0) mot = 'Aucun raté cette semaine. Continue comme ça.';
  else if (delta !== null && delta > 0) mot = 'Plus d\'XP que la semaine dernière malgré quelques ratés : la progression est là.';
  else mot = 'Semaine plus difficile. Choisis UNE habitude à sécuriser la semaine prochaine.';
  return `<div class="bilan ${dimanche ? 'dimanche' : ''}">
    <h3>${dimanche ? 'Bilan du dimanche' : 'Semaine en cours'}</h3>
    <div class="sous">Du ${dateCourte(b.lundi)} au ${dateCourte(b.dimanche)}</div>
    <div class="kpis">

      <div class="kpi"><b>${b.faits}</b><span>quêtes faites</span></div>
      <div class="kpi"><b>${b.aJour}/${b.total}</b><span>habitudes à jour</span></div>
      <div class="kpi"><b>${b.rates}</b><span>ratés</span></div>

  </div>`;
}

function statsDe(s) {
  return (s.stats || []).map(st => {
    const mod = Math.floor((st.score - 10) / 2); // comme en D&D : 8-9 → −1, 10-11 → +0, 12-13 → +1…
    const max = st.score >= 20, xpp = s.xpParPoint || 1;
    const dansPalier = st.xp % xpp;
    const pct = max ? 100 : dansPalier / xpp * 100;
    return `<div class="stat2">
      <div class="stat2-top"><span>${ICONES[st.nom] || ''} <b>${st.nom}</b></span>
        <span><span class="sc">${st.score}</span> <span class="md ${mod < 0 ? 'neg' : ''}">${mod >= 0 ? '+' : '−'}${Math.abs(mod)}</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="stat2-sub">${max ? 'Score maximum atteint' : `${Math.round(dansPalier).toLocaleString('fr-FR')} / ${Number(xpp).toLocaleString('fr-FR')} XP avant ${st.score + 1}`} · ${Math.round(st.xp).toLocaleString('fr-FR')} XP au total</div>
    </div>`;
  }).join('');
}

function dessinerGrille() {
  const c = document.getElementById('lifegrid');
  if (!c || !profil || !profil.grille) return;
  const g = c.getContext('2d'), t = 6;
  for (let i = 0; i < profil.grille.length; i++) {
    const code = profil.grille[i], x = (i % 52) * t, y = Math.floor(i / 52) * t;
    g.fillStyle = COULEURS_GRILLE[code] || COULEURS_GRILLE[0];
    g.fillRect(x, y, t - 1, t - 1);
    if (code === '6') { g.strokeStyle = '#d4ad3c'; g.lineWidth = 1; g.strokeRect(x - .5, y - .5, t, t); }
  }
  g.fillStyle = 'rgba(212,173,60,.35)';
  for (let d = 10; d < 80; d += 10) g.fillRect(0, d * t - 1, 52 * t, 1);
}

/** Appel d'un réglage : met à jour l'état et réaffiche. */
/* Effet attendu de chaque réglage, appliqué tout de suite à l'écran (le Sheet confirme ensuite) */
const EFFETS_REGLAGE = {
  basculerPause: (n, nom) => { const h = n.habitudes.find(x => x.nom === nom); if (h) h.enPause = !h.enPause; },
  reglerConfort: (n, c) => { n.reglages.confort = c; },
  reglerDevise: (n, d) => { n.reglages.devise = d; },
  preparerSort: (n, q) => { n.capacites = Object.assign({}, n.capacites, { sortPrepare: q }); },
  utiliserRestauration: (n, q) => {
    const h = n.habitudes.find(x => x.nom === q) || n.annexes.find(x => x.nom === q);
    if (h && h.jour.rate > 0) h.jour.rate--;
    if (!n.arc) n.pv = Math.min(n.pvMax, n.pv + (n.regles ? n.regles.pen : 0));
  },
  renommerQuete: (n, ancien, nouveau) => { [...n.habitudes, ...n.annexes].forEach(x => { if (x.nom === ancien) x.nom = nouveau; }); },
  changerDifficulte: (n, v) => { n.reglages.difficulte.niveau = v; },
  choisirTitre: (n, id) => { if (n.titres) n.titres.choisi = id || ''; },
  encourager: n => { if (n.camp) n.camp.encourage = true; },
  voterMJ: (n, i) => { const m = n.mj; if (!m) return; m.monVote = i; m.votes = Object.assign({}, m.votes, { [n.heros]: i });
    const autres = Object.keys(m.votes).filter(k => k !== n.heros); if (autres.length && m.votes[autres[0]] === i) { m.decision = i; m.parMJ = false; } },
  toggleVacances: n => {
    const R = n.reglages;
    if (n.vacances) { n.vacances = null; (R.vacances || []).forEach(v => { if (v.enCours) { v.enCours = false; v.fin = isoPlus(n.today, -1); } }); R.vacances = (R.vacances || []).filter(v => v.fin === '' || v.fin >= n.today); }
    else { n.vacances = { depuis: n.today }; (R.vacances = R.vacances || []).push({ index: -1, debut: n.today, fin: '', enCours: true }); }
  },
  planifierVacances: (n, deb, fin) => {
    const enCours = deb <= n.today && (!fin || fin >= n.today);
    (n.reglages.vacances = n.reglages.vacances || []).push({ index: -1, debut: deb, fin: fin || '', enCours });
    if (enCours) n.vacances = { depuis: deb };
  },
  supprimerVacances: (n, i) => {
    const R = n.reglages, v = (R.vacances || []).find(x => x.index === i);
    R.vacances = (R.vacances || []).filter(x => x.index !== i);
    if (v && v.enCours) n.vacances = null;
  },
  decalerSeance: (n, nom, de, a) => { (n.reglages.decalages = n.reglages.decalages || []).push({ nom, de, a });
    const h = n.habitudes.find(x => x.nom === nom); if (h) { (h.decalages = h.decalages || []).push({ nom, de, a }); if (de === n.today && !h.jour.fait) h.aFaire = false; if (a === n.today) h.aFaire = true; } },
  annulerDecalage: (n, nom, de, a) => { const f = x => !(x.nom === nom && x.de === de && x.a === a); n.reglages.decalages = (n.reglages.decalages || []).filter(f);
    const h = n.habitudes.find(x => x.nom === nom); if (h) { h.decalages = (h.decalages || []).filter(f); if (a === n.today && !h.jour.fait) h.aFaire = false; if (de === n.today) h.aFaire = true; } },
  reglerRappel: (n, cfg) => { n.reglages.rappel = Object.assign({}, n.reglages.rappel, cfg); },
  planifierVoyage: (n, debut, fin, noms) => { const v = (n.reglages.voyages = n.reglages.voyages || []); v.push({ debut, fin, quetes: noms }); },
  annulerVoyage: (n, debut, fin) => { n.reglages.voyages = (n.reglages.voyages || []).filter(v => !(v.debut === debut && v.fin === fin)); },
  equiperOrnement: (n, slot, id) => { n.reglages.ornements = Object.assign({}, n.reglages.ornements, { [slot]: id || '' }); },
  sauvegarderMaintenant: n => { if (n.reglages.sauvegarde) n.reglages.sauvegarde.derniere = n.today; },
  proposerPacte: (n, id) => { if (n.camp) { const m = n.camp.modeles.find(x => x.id === id); if (m) n.camp.pacte = { id, texte: m.texte, par: n.heros, accepte: false }; } },
  accepterPacte: n => { if (n.camp && n.camp.pacte) Object.assign(n.camp.pacte, { accepte: true, ok: true, detail: 'pacte scellé' }); }
};
async function regler(fn, ...args) {
  const effet = EFFETS_REGLAGE[fn];
  if (effet && state) {
    if (!confirme) confirme = state;
    try { const n = copie(state); effet(n, ...args); state = n; render(); } catch (e) {}
  }
  envoisEnCours++;
  const p = fileEnvois.then(() => api(fn, ...args));
  fileEnvois = p.catch(() => {});
  try {
    const s = await p; envoisEnCours--;
    if (envoisEnCours === 0) { state = avecAttente(s); confirme = null; render(); } else confirme = s;
    return true;
  } catch (e) {
    envoisEnCours--;
    const m = e && e.message ? e.message : String(e);
    // les refus normaux du serveur (« déjà encouragé », « plus de joker »…) ne sont pas des pannes
    const refus = /^(OCCUPE|Pas assez|Pas en vente|Plus de joker|Seules|On ne|Le décalage|Cette quête|Ce jour|Jours invalides|Palier|C'est déjà|Nom trop|Le nouveau nom|Plus rien|Déjà|Tu as déjà|Une fois|Le pacte|C'est à ton|Aucun pacte|Le destin|Le chapitre|Ce titre|Prochain changement|Ces dates|La fin)/.test(m);
    toast(estHorsLigne(e) ? '📴 Hors connexion : ce réglage demande le réseau, réessaie quand tu es connecté' : m.replace(/^OCCUPE : /, ''), estHorsLigne(e) || refus ? 'info' : 'erreur');
    if (confirme && envoisEnCours === 0) { state = confirme; confirme = null; }
    render(); return false;
  }
}

/* Export (lot 5.1) : une copie de ta fiche, des saisies en attente et du Carnet, enregistrée sur le téléphone (fichier JSON).
   Utile pour garder une trace à toi, ou pour dépanner si le Sheet était inaccessible. */
function exporterDonnees() {
  const lire = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const donnees = { exporteLe: new Date().toISOString(), app: NUMERO_APP + ' · ' + VERSION_APP, carnet: NUMERO_CARNET + ' · ' + VERSION_CARNET,
    heros: herosActif || (state && state.heros) || '', fiche: state, saisiesEnAttente: lireAttente(), saisiesEnCoursEnvoi: lireEnVol(),
    carnetDeQuetes: lire('quetes-state'), vacancesCarnet: lire('quetes-vacances') };
  const nom = 'compagnie-' + String(donnees.heros || 'heros').split(' ')[0].toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '') + '-' + isoLocal() + '.json';
  try {
    const url = URL.createObjectURL(new Blob([JSON.stringify(donnees, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('📥 ' + nom + ' enregistré dans tes Téléchargements');
  } catch (e) { toast('Export impossible : ' + ((e && e.message) || e), 'erreur'); }
}

/**
 * Montée de niveau en plein écran : le chiffre grimpe dans un anneau qui se remplit, éclats dorés,
 * puis un petit récap (titre, XP, capacité ou ornements débloqués, caractéristiques, prochaine évolution).
 * `avant` = l'état juste avant la saisie (pour savoir ce qui vient de se débloquer).
 */
function niveauSup(n, titre, nouveauTitre, avant, apres, evolue) {
  if (!confort().animations) { toast(`Niveau ${n}${nouveauTitre ? ' · ' + titre : ''}`); if (apres) setTimeout(apres, 1500); return; }
  document.querySelectorAll('.lvl-ov').forEach(x => x.remove());
  const s = state, CL = classeDe(s), pal = palierDe(n, CL);
  const prochain = CL.paliers[pal + 1];
  const capa = CL.capacites.find(c => c.n === n);
  const orn = avant ? ORNEMENTS.filter(o => ornementDebloque(s, o) && !ornementDebloque(avant, o)) : [];
  const stats = avant && avant.stats && s.stats ? s.stats.map(x => { const a = avant.stats.find(y => y.nom === x.nom); return a && Number(x.score) > Number(a.score) ? { nom: x.nom, de: a.score, a: x.score } : null; }).filter(Boolean) : [];
  const ligne = (ic, html) => `<li><i>${ic}</i><span>${html}</span></li>`;
  const recap = [
    nouveauTitre ? ligne('👑', `Nouveau titre : <b>${esc(titre)}</b>`) : '',
    ligne('⚡', `<b>${Math.round(Number(s.xpTotale) || 0).toLocaleString('fr-FR')} XP</b> au total`),
    capa ? ligne('🔓', `Capacité débloquée : <b>${esc(capa.nom)}</b><small>${esc(capa.d)}</small>`) : '',
    ...orn.map(o => ligne('✨', `Ornement gagné : <b>${esc(o.nom)}</b><small>à porter depuis la vitrine</small>`)),
    ...stats.map(x => ligne(ICONES[x.nom] || '🧬', `${esc(x.nom)} <b>${x.de} → ${x.a}</b>`)),
    prochain ? ligne('🌟', `Prochaine évolution : <b>${esc(prochain.titre)}</b><small>au niveau ${prochain.n}, encore ${prochain.n - n} niveau${prochain.n - n > 1 ? 'x' : ''}</small>`)
      : ligne('🌟', '<b>Forme ultime</b> atteinte')
  ].filter(Boolean);
  const eclats = Array.from({ length: 28 }, (_, i) => `<i style="--a:${(i * 360 / 28).toFixed(0)}deg;--d:${(i % 7) * .05}s;--l:${90 + (i % 4) * 28}px"></i>`).join('');
  const el = document.createElement('div');
  el.className = 'lvl-ov';
  el.innerHTML = `<div class="lvl-rayons"></div><div class="lvl-eclats">${eclats}</div>
    <div class="lvl-box">
      <div class="lvl-anneau"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="fond"/><circle cx="60" cy="60" r="52" class="plein"/></svg>
        <div class="lvl-num"><small>NIVEAU</small><b data-n="${n}">${n - 1}</b></div></div>
      <h2>Niveau ${n} atteint</h2>
      <p class="lvl-sous">${evolue ? `${esc(s.heros || '')} est devenu ${esc((CL.paliers[pal] || {}).titre || '')}` : `${esc(s.heros || '')} gagne en puissance`}</p>
      <ul class="lvl-recap">${recap.map((l, i) => l.replace('<li>', `<li style="--i:${i}">`)).join('')}</ul>
      <button class="btn or" data-lvl-fin="1">Continuer</button>
    </div>`;
  document.body.appendChild(el); document.body.classList.add('bloque');
  const num = el.querySelector('.lvl-num b');
  setTimeout(() => { num.textContent = n; num.classList.add('pop'); vib([60, 40, 140]); }, 1050);
  const fin = () => { if (!el.isConnected) return; el.classList.add('sortie'); document.body.classList.remove('bloque'); setTimeout(() => el.remove(), 400); if (apres) setTimeout(apres, 450); };
  el.addEventListener('click', e => { if (e.target.closest('[data-lvl-fin]') || el.classList.contains('fini')) fin(); });
  setTimeout(() => el.classList.add('fini'), 1800);
  setTimeout(fin, 15000);
}
function celebrer(liste) {
  (liste || []).filter(b => {
    if (b.type !== 'boss') return true;
    const nom = String(b.titre).replace(/^⚔️ /, '').replace(/ est vaincu !$/, '');
    const vrai = state && state.boss && [state.boss.semaine, state.boss.mois].find(x => x && x.nom === nom);
    bossVaincu(Object.assign({}, vrai || {}, { nom, visuel: b.visuel || (vrai && vrai.visuel), xp: b.xp || (vrai && vrai.xp), trophee: b.trophee, type: b.mois ? 'mois' : 'semaine' }));
    return false;
  }).forEach((b, i) => setTimeout(() => {
    const el = document.createElement('div');
    el.className = 'bonus-pop';
    el.innerHTML = `<b>${esc(b.titre)}</b><span>${esc(b.texte)}</span>`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2700);
