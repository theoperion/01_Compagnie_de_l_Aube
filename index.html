}
function evolution(niveau, titre, nouveauTitre, avant) {
  const CL = classeDe(), pal = palierDe(niveau, CL), p = CL.paliers[pal];
  if (!confort().animations) { toast(`Évolution : ${p.titre}`); setTimeout(() => demanderLegende(p, true), 1500); return; }
  cinematiqueEvolution(pal, false, () => niveauSup(niveau, titre || state.titre, !!nouveauTitre, avant, () => demanderLegende(p, true), true));
}
/**
 * Cinématique d'évolution, façon montée de niveau de jeu de rôle :
 * l'écran s'assombrit, un cercle de runes se trace, la lumière converge, l'ancienne forme s'embrase,
 * éclair blanc, onde de choc, puis la nouvelle forme se révèle dans une gerbe de rayons dorés.
 */
function cinematiqueEvolution(pal, revoir, apres) {
  const CL = classeDe(), p = CL.paliers[pal], av = CL.paliers[pal - 1];
  const vieux = av ? orner(CL.dessin(pal - 1, 'cev0', lookDe(state && state.look)), null, 'cev0') : '';
  const neuf = orner(CL.dessin(pal, 'cev1', lookDe(state && state.look)), ornementsDe(state), 'cev1');
  const runes = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';
  const parts = Array.from({ length: 26 }, (_, i) => `<i style="--a:${(i * 360 / 26).toFixed(0)}deg;--d:${(i % 5) * .08}s"></i>`).join('');
  const el = document.createElement('div');
  el.className = 'cine';
  el.innerHTML = `
    <div class="cine-rayons"></div>
    <svg class="cine-cercle" viewBox="0 0 200 200"><circle cx="100" cy="100" r="88" /><circle cx="100" cy="100" r="74" class="c2"/>
      ${[...runes].map((r, i) => { const a = i / runes.length * Math.PI * 2; return `<text x="${(100 + 81 * Math.cos(a)).toFixed(1)}" y="${(103 + 81 * Math.sin(a)).toFixed(1)}" text-anchor="middle">${r}</text>`; }).join('')}
      <path d="M100 30 L161 135 L39 135 Z M100 170 L39 65 L161 65 Z" class="c3"/></svg>
    <div class="cine-conv">${parts}</div>
    <div class="cine-pilier"></div>
    <div class="cine-perso vieux">${vieux}</div>
    <div class="cine-perso neuf">${neuf}</div>
    <div class="cine-onde"></div><div class="cine-flash"></div>
    <div class="cine-eclats">${parts}</div>
    <div class="cine-txt"><small>${revoir ? 'Souvenir d\'évolution' : 'Niveau ' + p.n + ' atteint'}</small><b>ÉVOLUTION</b><span>${esc(p.titre)}</span><em>${esc(p.desc)}</em>
      <button class="btn or" data-cine-fin="1">Continuer</button></div>`;
  document.body.appendChild(el);
  const fin = () => { if (!el.isConnected) return; el.classList.add('sortie'); setTimeout(() => el.remove(), 450); if (apres) apres(); };
  el.addEventListener('click', e => { if (e.target.closest('[data-cine-fin]') || el.classList.contains('fini')) fin(); });
  setTimeout(() => vib([30, 60, 30, 60, 30]), 900);
  setTimeout(() => vib([60, 40, 60, 40, 220]), 2900);
  setTimeout(() => el.classList.add('fini'), 4600);
  setTimeout(fin, 12000);
}
/* Messages du bas de l'écran, en 3 couleurs :
 *  - rouge   (erreur) : quelque chose n'a pas marché ;
 *  - ambre   (info)   : un refus normal (« déjà fait », « plus de joker »…) ou le hors connexion ;
 *  - doré/vert (ok)   : une bonne nouvelle, une confirmation.
 * Le type est deviné tout seul ; on peut le forcer : toast(msg, 'erreur' | 'info' | 'ok'). */
const RE_ERREUR = /impossible|indisponible|ne répond pas|erreur|échec|n'a pas pu|inattendu|introuvable|invalide|inconnu|refusée?s?\b|exception|\bcellule|#REF|#N\/A|\b(range|undefined|null|cannot|failed|error|TypeError)\b/i;
const RE_INFO = /^📴|hors connexion|pas de réseau|déjà|plus de joker|choisis|coche|pas encore|réservé|seules|on ne|attends|patiente/i;
let toastT = null;
function toast(msg, type) {
  msg = String(msg == null ? '' : msg);
  type = type || (RE_ERREUR.test(msg) && !/^📴/.test(msg) ? 'erreur' : RE_INFO.test(msg) ? 'info' : 'ok');
  if (type === 'erreur' && navigator.onLine !== false) signaler({ ou: 'toast', msg });
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast ' + type; t.style.display = 'block';
  clearTimeout(toastT); // un nouveau message ne disparaît plus à cause du minuteur du précédent
  toastT = setTimeout(() => (t.style.display = 'none'), type === 'erreur' ? 6000 : 3800);
}

/* ---------- Saisies : réponse immédiate à l'écran, synchronisation en arrière-plan ----------
 * La carte, l'XP et les PV bougent dès le toucher (prédiction locale). Les envois partent ensuite
 * un par un vers le Sheet ; quand le dernier revient, l'état exact du serveur remplace la prédiction.
 */
let fileEnvois = Promise.resolve(), envoisEnCours = 0, confirme = null;
const copie = o => JSON.parse(JSON.stringify(o));

/** Prédit l'effet d'une saisie. Renvoie null si on ne sait pas la prédire (on attend alors le serveur). */
/* Historique des saisies de la session, par quête : sert à savoir quoi annuler sans attendre le Sheet */
const histoSaisies = {};
function derniereSaisie(q) {
  const h = histoSaisies[q.nom] || [];
  for (let i = h.length - 1; i >= 0; i--) if (q.jour[h[i]] > 0) return h[i];
  return q.jour.fait > 0 ? 'fait' : q.jour.rate > 0 ? 'rate' : q.jour.repos > 0 ? 'repos' : '';
}
/* Ajoute (ou retire, si dXp < 0) de l'XP à l'état prédit, avec la barre et le niveau */
function bougerXp(n, res, dXp) {
  res.dXp = dXp;
  const span = n.progression < 1 && n.progression > 0 ? n.xpSuivant / (1 - n.progression) : n.xpSuivant || 0;
  n.xpTotale = Number(n.xpTotale) + dXp;
  if (dXp > 0 && dXp >= n.xpSuivant && n.xpSuivant > 0) { // la montée de niveau se voit tout de suite
    n.niveau = Number(n.niveau) + 1; res.monte = n.niveau;
    n.progression = 0.03; n.xpSuivant = Math.max(1, Math.round(span * 1.1)); // le Sheet donnera la valeur exacte
  } else {
    n.xpSuivant = Math.max(0, n.xpSuivant - dXp);
    if (span > 0) n.progression = Math.max(0, Math.min(1, n.progression + dXp / span));
  }
}
function predire(s, nom, statut) {
  const R = s.regles;
  if (!R) return null;
  const n = copie(s);
  const q = n.habitudes.find(h => h.nom === nom) || n.annexes.find(a => a.nom === nom);
  if (!q) return null;
  const estAnnexe = !n.habitudes.some(h => h.nom === nom);
  const res = { etat: n, dXp: 0, dPv: 0 };
  const capa = n.capacites || {};
  const gain = rang => {
    const epuise = n.arc || n.pv < n.seuilEpuise;
    const sort = capa.sortPrepare === nom ? 1.5 : 1;
    const sournoise = capa.roublard && estAnnexe && (capa.liste || []).some(c => c.n === 5 && c.debloquee && /^Prête/.test(c.statut)) ? 2 : 1;
    return Math.round((Number(q.xp) || 0) * R.rend[Math.min(rang, 2)] * (epuise ? n.malus : 1) * (R.xpMult || 1) * ((n.d20 && n.d20.mult) || 1) * sort * sournoise * multEvt(n, q, estAnnexe) * (maudite(n, q) ? 0.85 : 1));
  };
  // Coups spéciaux que cette quête brise (le Bouclier demande une quête de chacun : le Sheet tranchera)
  const brises = statut === 'Fait' && n.boss ? ['semaine', 'mois'].filter(t => { const b = n.boss[t], c = coupActif(b); return c && c.capacite !== 'bouclier' && briseCoup(n, b, q); }) : [];
  const soin = estAnnexe ? R.soinAnnexe : R.soinHab;
  if (statut === 'Fait') {
    const deja = q.jour.fait;
    bougerXp(n, res, gain(deja));
    if (!deja && !n.arc) res.dPv = Math.min(n.pvMax - n.pv, soin);
    q.jour.fait++;
    if (estAnnexe) q.fois = (Number(q.fois) || 0) + 1; else q.semaine = (Number(q.semaine) || 0) + 1;
    if (estAnnexe && q.groupe) n.annexes = n.annexes.filter(a => a === q || a.groupe !== q.groupe || a.jour.fait || a.jour.rate || a.jour.repos);
    res.trace = 'fait';
  } else if (statut === 'hier') { // rattrapage de la veille : XP tout de suite, le Sheet recalcule le reste
    bougerXp(n, res, gain(0));
    if (!n.arc) res.dPv = Math.min(n.pvMax - n.pv, soin);
    if (!estAnnexe && indexJour(n.today) !== 0) q.semaine = (Number(q.semaine) || 0) + 1;
  } else if (statut === 'Raté') {
    if (!n.arc) res.dPv = -Math.min(n.pv, R.pen);
    q.jour.rate++; res.trace = 'rate';
  } else if (statut === 'Repos') {
    if (n.jokersRestants <= 0) return null;
    n.jokersRestants--; q.jour.repos++; res.trace = 'repos';
  } else if (statut === 'undo') {
    const quoi = derniereSaisie(q);
    if (!quoi) return null;
    res.annule = quoi;
    if (quoi === 'fait') {
      q.jour.fait--;
      bougerXp(n, res, -gain(q.jour.fait));
      if (q.jour.fait === 0 && !n.arc) res.dPv = -Math.min(n.pv, soin);
      if (estAnnexe) q.fois = Math.max(0, (Number(q.fois) || 0) - 1); else q.semaine = Math.max(0, (Number(q.semaine) || 0) - 1);
    } else if (quoi === 'rate') {
      q.jour.rate--;
      if (!n.arc) res.dPv = Math.min(n.pvMax - n.pv, R.pen);
    } else { q.jour.repos--; n.jokersRestants++; }
  }
  // Boss : dégâts et riposte tout de suite
  if (n.boss && n.boss.regles) ['semaine', 'mois'].forEach(t => {
    const b = n.boss[t];
    if (!b || b.statut !== 'En cours') return;
    const rip = Math.round(b.pvMax * (t === 'mois' ? n.boss.regles.ripMois : n.boss.regles.ripSemaine));
    let d = 0;
    if (res.dXp) d = degatsQuete(n, b, q, res.dXp, estAnnexe);
    if (brises.includes(t) && b.coupDuJour) { b.coupDuJour.brise = true; b.coupDuJour.breche = true; (res.brise = res.brise || []).push(b.coupDuJour.nom); }
    if (statut === 'Raté' && coupActif(b) && (b.coupDuJour.capacite === 'vol' || b.coupDuJour.capacite === 'hurlement')) res.subi = b.coupDuJour;
    if (d > 0 && b.sbire && !b.sbire.vaincu) { // le sbire prend les coups d'abord
      const pris = Math.min(d, b.sbire.pv); b.sbire.pv -= pris; d -= pris;
      if (b.sbire.pv <= 0) { b.sbire.vaincu = true; res.sbireAbattu = true; }
    }
    if (statut === 'Raté' || (statut === 'undo' && res.annule === 'rate')) {
      const sens = statut === 'Raté' ? 1 : -1;
      b.riposte = Math.max(0, (b.riposte || 0) + sens * rip); b.pv = Math.max(0, b.pv + sens * rip);
      if (sens > 0 && t === 'semaine') res.ripBoss = rip;
      if (b.coups && sens > 0) b.coups.unshift({ date: n.today, heros: n.heros, quete: q.nom, type: 'riposte', valeur: rip });
      if (b.coups && sens < 0) { const k = b.coups.findIndex(c => c.type === 'riposte' && c.quete === q.nom && c.heros === n.heros); if (k >= 0) b.coups.splice(k, 1); }
    }
    if (d) {
      b.degats[n.heros] = Math.max(0, (b.degats[n.heros] || 0) + d);
      b.pv = Math.max(0, b.pv - d);
      if (d > 0) (res.coups = res.coups || []).push({ t, d });
      if (d > 0 && b.coups) b.coups.unshift({ date: n.today, heros: n.heros, quete: q.nom, type: 'coup', valeur: d, faible: q.carac === b.faible, resiste: q.carac === b.resiste });
      if (d < 0 && b.coups) { const k = b.coups.findIndex(c => c.type === 'coup' && c.quete === q.nom && c.heros === n.heros && c.date === n.today); if (k >= 0) b.coups.splice(k, 1); }
      if (b.pv === 0 && d > 0) { b.statut = 'Vaincu'; b.vaincuLe = n.today; (res.victoires = res.victoires || []).push(b); }
    }
  });
  n.pv += res.dPv;
  if (!n.arc) n.etat = n.pv < n.seuilEpuise ? `Épuisé (XP ×${String(n.malus).replace('.', ',')})` : 'En forme';
  return res;
}

let niveauCelebre = 0;
function celebrerChangements(avant, apres) {
  if (!avant || !apres) return;
  if (niveauCelebre && apres.niveau <= niveauCelebre) { celebrer(apres.nouveauxBonus); return; } // déjà fêté à la prédiction
  if (palierDe(apres.niveau, classeDe(apres)) > palierDe(avant.niveau, classeDe(apres))) setTimeout(() => evolution(apres.niveau, apres.titre, apres.titre !== avant.titre, avant), 500);
  else if (apres.niveau > avant.niveau) setTimeout(() => niveauSup(apres.niveau, apres.titre, apres.titre !== avant.titre, avant), 500);
  celebrer(apres.nouveauxBonus);
}

const dernierToucher = {};
function agir(nom, statut) {
  if (busy.has(nom)) return;
  // Anti double-toucher : un 2e toucher sur la même carte en moins de 0,7 s est ignoré
  const t = Date.now();
  if (statut === 'Fait' && dernierToucher[nom] && t - dernierToucher[nom] < 700) return;
  dernierToucher[nom] = t;
  const annexe = state.annexes.find(x => x.nom === nom);
  if (statut === 'Fait' && annexe && !annexe.repetable && annexe.jour.fait > 0) { toast('Quête unique : déjà accomplie ✔'); return; }
  if (!confirme) confirme = state;
  const avantSaisie = state;
  const pred = predire(state, nom, statut);
  if (pred) {
    if (pred.trace) (histoSaisies[nom] = histoSaisies[nom] || []).push(pred.trace);
    if (pred.annule) { const h = histoSaisies[nom] || []; const k = h.lastIndexOf(pred.annule); if (k >= 0) h.splice(k, 1); }
    state = pred.etat; render();
    if (pred.annule) { toast('↩️ Saisie annulée'); if (pred.dXp < 0) flotter(`${pred.dXp} XP${pred.dPv ? ` · ${pred.dPv > 0 ? '+' : ''}${pred.dPv} PV` : ''}`, 'var(--muted)'); else if (pred.dPv) flotter(`+${pred.dPv} PV`, 'var(--ok)'); }
    if (!pred.annule && pred.dXp > 0) flotter(`+${pred.dXp} XP${pred.dPv > 0 ? ` · +${pred.dPv} PV` : ''}`, 'var(--xp2)');
    else if (!pred.annule && pred.dPv < 0) flotter(`Toi : ${pred.dPv} PV${pred.ripBoss ? ` · 🐉 boss +${pred.ripBoss} PV` : ''}`, 'var(--pv)');
    else if (!pred.annule && pred.ripBoss) flotter(`🐉 Le boss se soigne : +${pred.ripBoss} PV`, 'var(--pv)');
    else if (statut === 'Repos') flotter('Repos', 'var(--rest)');
    if (pred.dXp > 0) vib(25);
    if (pred.dXp > 0 && dernierToucherXY) effetTrainee(dernierToucherXY[0], dernierToucherXY[1]);
    if (pred.coups && pred.coups.length) setTimeout(() => flotter(`⚔ −${pred.coups[0].d} PV au boss`, '#ff8b7a'), 450);
    setTimeout(() => frapperBoss(pred.coups && pred.coups.length && pred.coups[0].d > 0 ? 'hit' : statut === 'Raté' ? 'riposte' : ''), 60);
    (pred.victoires || []).forEach((b, i) => setTimeout(() => bossVaincu(b), 700 + i * 300));
    if (pred.brise) setTimeout(() => { effetCoup('eclat'); toast('✨ ' + pred.brise.join(' et ') + ' brisé' + (pred.brise.length > 1 ? 's' : '') + ' ! Brèche : +25 % de dégâts aujourd\'hui'); }, 900);
    if (pred.sbireAbattu) setTimeout(() => toast('👹 Sbire abattu ! +20 XP chacun'), 1300);
    if (pred.subi) setTimeout(() => { effetCoup('subi'); toast(pred.subi.capacite === 'vol' ? '🃏 Le boss te vole ton joker !' : '📢 Le boss hurle : sa riposte compte double'); }, 900);
    if (pred.monte) { // montée de niveau fêtée tout de suite, sans attendre la réponse du Sheet
      niveauCelebre = pred.monte;
      const cl = classeDe(state);
      if (palierDe(pred.monte, cl) > palierDe(pred.monte - 1, cl)) setTimeout(() => evolution(pred.monte, state.titre, false, avantSaisie), 350);
      else setTimeout(() => niveauSup(pred.monte, state.titre, false, avantSaisie), 350);
    }
  } else { busy.add(nom); render(); }
  const item = statut === 'undo' ? { id: nouvelId(), type: 'undo', quete: nom, date: isoLocal() }
    : { id: nouvelId(), type: 'saisie', quete: nom, statut: statut === 'hier' ? 'Fait' : statut, date: statut === 'hier' ? isoLocalPlus(-1) : isoLocal(), hier: statut === 'hier' };
  // Déjà des saisies en attente (ou pas de réseau) : celle-ci rejoint la file, dans l'ordre
  if (lireAttente().length || navigator.onLine === false) {
    busy.delete(nom);
    const l = lireAttente();
    // annuler une saisie pas encore envoyée : on la retire simplement de la file
    const k = item.type === 'undo' ? l.map(x => x.type === 'saisie' && x.quete === nom && x.date === item.date).lastIndexOf(true) : -1;
    if (k >= 0) { l.splice(k, 1); ecrireAttente(l); } else { l.push(item); ecrireAttente(l); }
    if (!pred) toast('Hors connexion : saisie gardée, elle partira au retour du réseau');
    memoriserEtat(); render();
    if (navigator.onLine !== false) envoyerAttente(true);
    return;
  }
  envoisEnCours++;
  ajouterEnVol(item);
  const appel = () => api('saisirHorsLigne', [Object.assign({ direct: true }, item)]).then(etat => {
    const r = (etat.horsLigne || [])[0];
    if (r && !r.ok) throw new Error(r.message);
    return etat;
  });
  fileEnvois = fileEnvois.then(appel).then(apres => {
    envoisEnCours--; busy.delete(nom); retirerEnVol(item.id);
    const avant = confirme; confirme = apres;
    if (!pred) { // saisie non prédite : retour visuel à l'arrivée
      const dXp = apres.xpTotale - avant.xpTotale, dPv = apres.pv - avant.pv;
      if (dXp > 0) flotter(`+${Math.round(dXp)} XP${dPv > 0 ? ` · +${dPv} PV` : ''}`, 'var(--xp2)');
      else if (dPv < 0) flotter(`Toi : ${dPv} PV`, 'var(--pv)');
    }
    celebrerChangements(avant, apres);
    if (envoisEnCours === 0) { state = avecAttente(apres); confirme = null; render(); }
  }).catch(e => {
    envoisEnCours--; busy.delete(nom);
    if (estHorsLigne(e)) { // pas de réseau : la saisie est gardée, l'écran garde son effet
      mettreEnAttente(item); retirerEnVol(item.id);
      toast('📴 Hors connexion : saisie gardée sur le téléphone, elle partira au retour du réseau');
      if (envoisEnCours === 0 && confirme) confirme = null;
      return;
    }
    retirerEnVol(item.id);
    toast('Échec de l\'enregistrement : ' + (e && e.message ? e.message : e));
    // On revient à la vérité du Sheet
    return api('getState').then(s => { if (envoisEnCours === 0) { state = avecAttente(s); confirme = null; } else confirme = s; render(); })
      .catch(() => { if (confirme && envoisEnCours === 0) { state = confirme; confirme = null; render(); } });
  });
}

/** Renomme partout (onglet, Journal, quête épique liée, pauses, décalages) : l'historique suit. */
async function renommer(nom) {
  const nouveau = prompt(`Nouveau nom pour « ${nom} »\n(l'historique, les séries et l'XP suivent la quête)`, nom);
  if (nouveau === null || nouveau.trim() === '' || nouveau.trim() === nom) return;
  if (await regler('renommerQuete', nom, nouveau.trim())) toast(`Renommée en « ${nouveau.trim()} » ✏️`);
}

const SEANCES_MOBILES = /^(course|renfo)/i;
function joursPourDecaler(h) {
  const jr = joursRestantsSemaine(), today = state.today;
  const pris = (h.decalages || []).flatMap(x => [x.de, x.a]);
  return {
    de: jr.filter(d => prevu(h, d) && !pris.includes(d) && !(h.jour.fait && d === today)),
    a: jr.filter(d => !prevu(h, d) && !pris.includes(d))
  };
}
function ouvrirMenu(nom) {
  menuQuete = nom;
  const h = state && state.habitudes.find(x => x.nom === nom);
  document.getElementById('btnJour').style.display = h && h.type === 'Routine' && SEANCES_MOBILES.test(nom) ? '' : 'none';
  document.getElementById('sheetTitle').textContent = nom;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheetBg').classList.add('on');
}
function ouvrirChangerJour(nom) {
  const h = state.habitudes.find(x => x.nom === nom);
  if (!h) return;
  const j = joursPourDecaler(h);
  const nomJour = d => (d === state.today ? 'aujourd\'hui' : JOURS_LONGS[indexJour(d)]) + ' ' + versDate(d).getDate();
  const decs = (h.decalages || []).filter(x => x.a >= state.today || x.de >= state.today);
  const el = document.getElementById('sheetPal');
  el.innerHTML = `<h3>📅 ${esc(nom)}</h3>
    <div class="muted" style="font-size:13px;margin:-4px 0 10px">Pour cette semaine seulement : pas de raté, le planning habituel ne change pas.</div>
    ${decs.map(x => `<div class="ligne" style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px"><span>${nomJour(x.de)} → ${nomJour(x.a)}</span>
      <button class="btn mini" data-jour-annul="${x.de}|${x.a}">Annuler</button></div>`).join('')}

/* ---------- Bouton retour d'Android : ferme ce qui est ouvert, revient aux Quêtes, puis deux appuis pour quitter ----------
 * Une « garde » est ajoutée à l'historique ; le bouton retour la consomme (popstate) et on la remet.
 * Chrome ignore les entrées ajoutées sans geste de l'utilisateur : la garde est aussi remise à chaque toucher. */
let retourQuitter = 0;
function gardeRetour() { try { if (!(history.state && history.state.garde)) history.pushState({ garde: 1 }, ''); } catch (e) {} }
document.addEventListener('click', gardeRetour, true);
window.addEventListener('popstate', () => {
  const ok = () => { gardeRetour(); };
  const ouvert = id => { const el = document.getElementById(id); return el && el.classList.contains('on') ? el : null; };
  const bw = document.querySelector('.boss-win');
  if (bw) { bw.remove(); document.body.classList.remove('bloque'); return ok(); }
  if (ouvert('ouvertureOv')) { ouvert('ouvertureOv').classList.remove('on'); document.body.classList.remove('bloque'); return ok(); }
  if (ouvert('reglesOv')) { fermerRegles(); return ok(); }
  if (ouvert('recapOv')) { fermerRecap(); return ok(); }
  if (ouvert('coffreOv')) { ouvert('coffreOv').classList.remove('on'); document.body.classList.remove('bloque'); render(); return ok(); }
  if (ouvert('bossVue')) { ouvert('bossVue').classList.remove('on'); document.body.classList.remove('bloque'); return ok(); }
  if (ouvert('vitrine')) { fermerVitrine(); return ok(); }
  if (ouvert('d20ov')) { fermerD20(); return ok(); }
  if (ouvert('sheet') || ouvert('sheetPal')) { fermerMenu(); return ok(); }
  if (compVue) { compVue = null; render(); return ok(); }
  if (onglet === 'heros' && sousHeros !== 'perso') { sousHeros = 'perso'; render(); window.scrollTo(0, 0); return ok(); }
  if (onglet !== 'quetes' || sousOnglet !== 'quetes') {
    onglet = 'quetes'; sousOnglet = 'quetes';
    try { localStorage.setItem('onglet', onglet); } catch (e) {}
    render(); window.scrollTo(0, 0); return ok();
  }
  if (Date.now() - retourQuitter < 2500) { history.back(); return; } // deuxième appui : on quitte vraiment
  retourQuitter = Date.now(); toast('Appuie encore sur retour pour quitter', 'info'); ok();
});

/* App laissée ouverte à l'écran au passage de minuit (lot 2.4) : elle passe au nouveau jour toute seule */
function planifierMinuit() {
  const d = new Date(), m = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1, 0, 0, 30);
  setTimeout(() => {
    if (state && premierEtatRecu && state.today && state.today < isoLocal() && (enLigne || distant)) {
      state = passerAuJour(state); render();
      if (envoisEnCours === 0 && navigator.onLine !== false)
        apiFond('getState').then(st => { if (envoisEnCours === 0 && st) { state = avecAttente(st); render(); celebrer(st.nouveauxBonus); } }).catch(() => {});
    }
    planifierMinuit();
  }, Math.max(1000, m - d));
}

function lancer() {

  // Nouveau jour : la fiche d'hier est tout de suite « passée au jour » sur le téléphone (compteurs du jour remis à zéro),
  // en attendant les chiffres exacts du Sheet. Plus d'écran d'hier pendant 10 secondes.
  if (memo && (enLigne || distant)) { state = passerAuJour(memo); render(); }
  else { dernierHtml = ''; document.getElementById('app').innerHTML = '<div class="loading">Chargement de ta feuille de personnage…</div>'; }

    state = avecAttente(s); premierEtatRecu = true;

let cacheLe = 0;
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { cacheLe = Date.now(); return; }
  if (!state || !premierEtatRecu || !(enLigne || distant)) return;
  const nouveauJour = state.today && state.today < isoLocal();
  if (nouveauJour) { state = passerAuJour(state); render(); }
  if ((nouveauJour || Date.now() - cacheLe > 10 * 60000) && envoisEnCours === 0 && navigator.onLine !== false) {
    apiFond('getState').then(st => { if (envoisEnCours === 0 && st) { state = avecAttente(st); render(); celebrer(st.nouveauxBonus); } }).catch(() => {});
    if (onglet === 'profil' && modeProfil === 'journal') chargerJournal(true);
  }
});
